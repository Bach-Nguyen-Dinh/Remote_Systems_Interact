<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #processedImage2 {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-data-overlay-processedImage2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(204, 204, 220, 0.65);
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <div id="noData2" class="no-data-overlay-processedImage2">No data</div>
            <img id="processedImage2">
        </div>
    </div>

    <script>
        const isDirectAccess = window.location.port === '3000';
        FLASK_BASE = isDirectAccess
            ? `http://${window.location.hostname}:5000`
            : `https://${window.location.hostname}`
            
        let lastShownCphd = null;

        function showImage(url) {
            document.getElementById("processedImage2").src = url;
            document.getElementById("processedImage2").style.display = "block";
            document.getElementById("noData2").style.display = "none";
        }

        function showNoData() {
            document.getElementById("processedImage2").src = "";
            document.getElementById("processedImage2").style.display = "none";
            document.getElementById("noData2").style.display = "flex";
        }

        function fetchColorizedImage(cphdFilename) {
            fetch(`${FLASK_BASE}/sar_colored_image?filename=${encodeURIComponent(cphdFilename)}`)
                .then(response => {
                    if (!response.ok) throw new Error("not found");
                    return response.blob();
                })
                .then(blob => showImage(URL.createObjectURL(blob)))
                .catch(() => showNoData());
        }

        async function pollLoop() {
            while (true) {
                try {
                    const response = await fetch(`${FLASK_BASE}/sar_image_ready_poll`);
                    const data = await response.json();
                    if (data.cphd_filename && data.cphd_filename !== lastShownCphd) {
                        lastShownCphd = data.cphd_filename;
                        setTimeout(() => fetchColorizedImage(data.cphd_filename), 3000);
                    } else if (!data.cphd_filename && lastShownCphd !== null) {
                        lastShownCphd = null;
                        showNoData();
                    }
                } catch {
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }
        pollLoop();
    </script>
</body>
</html>
