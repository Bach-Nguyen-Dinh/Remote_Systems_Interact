        function populate_options_num_ai_core_run() {
            const dropdown = document.getElementById('aiCoreDropdown');
            
            // Generate options 1 through 4
            for (let i = 1; i <= 4; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                
                // Set option 4 as default
                if (i === 4) {
                    option.selected = true;
                }
                
                dropdown.appendChild(option);
            }
        }

        function select_num_ai_core_run() {
            const dropdown = document.getElementById('aiCoreDropdown');
            numAICoreRun = parseInt(dropdown.value);
            console.log('Number of AI cores selected:', numAICoreRun);

        function createShuffledPairs() {
            const pairs = [];
            // Create pairs from cached images
            const inputKeys = Object.keys(aiSmokeInputImageCache);
            const outputKeys = Object.keys(aiSmokeOutputImageCache);
            
            // Match input/output pairs (assuming they have corresponding numbers/names)
            const minLength = Math.min(inputKeys.length, outputKeys.length);
            for (let i = 0; i < minLength; i++) {
                pairs.push({
                    input: inputKeys[i],
                    output: outputKeys[i]
                });
            }
            
            // Shuffle the pairs array
            for (let i = pairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
            }
            
            return pairs;
        }

        function startLocalImageDisplay() {
            // Create shuffled pairs
            imagePairs = createShuffledPairs();
            currentPairIndex = 0;
            
            // Display images every 0.5 seconds
            displayInterval = setInterval(() => {
                if (currentPairIndex < imagePairs.length) {
                    const pair = imagePairs[currentPairIndex];
                    displayImagePair(pair.input, pair.output);
                    currentPairIndex++;
                } else {
                    // All pairs shown, restart from beginning
                    currentPairIndex = 0;
                }
            }, 500);
        }

        function stopLocalImageDisplay() {
            if (displayInterval) {
                clearInterval(displayInterval);
                displayInterval = null;
            }
        }

        function updateProcessingTime() {
            if (startTime) {
                const elapsed = Math.floor((new Date() - startTime) / 1000);

                const seconds = elapsed % 60;
                document.getElementById('processingTime').textContent =

        window.preload_ai_smoke_images = async function() {
            try {
                console.log('Starting enhanced image load...');
                updateStatus('Loading image list...', 'running');
                
                const response = await fetch(`http://${FLASK_HOST}:${FLASK_PORT}/ai_smoke/image_list`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch image list: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Image list received:', data);
                
                const totalImages = data.input_images.length + data.output_images.length;
                updateStatus(`Loading input images...`, 'running');
                
                // Enhanced image loading with retry mechanism
                function loadImageWithRetry(src, filename, imageType, maxRetries = 3, timeout = 15000) {
                    return new Promise((resolve, reject) => {
                        let attempts = 0;
                        
                        function attemptLoad() {
                            attempts++;
                            console.log(`Attempting to load ${filename} (${imageType}) (attempt ${attempts}/${maxRetries})`);                            
                            const img = new Image();
                            let timeoutId;
                            
                            img.onload = () => {
                                clearTimeout(timeoutId);
                                console.log(`Successfully loaded: ${filename} (${imageType})`);
                                
                                // Validate that the image actually loaded with content
                                if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                                    // Store in appropriate cache
                                    if (imageType === 'input') {
                                        aiSmokeInputImageCache[filename] = img;
                                    } else {
                                        aiSmokeOutputImageCache[filename] = img;
                                    }
                                    resolve({ success: true, filename, imageType, attempts });
                                } else {
                                    console.warn(`Image loaded but has no dimensions: ${filename} (${imageType})`);
                                    if (attempts < maxRetries) {
                                        setTimeout(attemptLoad, 1000 * attempts);
                                    } else {
                                        reject(new Error(`Image has no dimensions after ${maxRetries} attempts: ${filename} (${imageType})`));
                                    }
                                }
                            };
                            
                            img.onerror = () => {
                                clearTimeout(timeoutId);
                                console.error(`Failed to load: ${filename} (${imageType}) (attempt ${attempts})`);
                                
                                if (attempts < maxRetries) {
                                    setTimeout(attemptLoad, 1000 * attempts);
                                } else {
                                    reject(new Error(`Failed to load after ${maxRetries} attempts: ${filename} (${imageType})`));
                                }
                            };
                            
                            // Set timeout for this attempt
                            timeoutId = setTimeout(() => {
                                console.warn(`Timeout loading: ${filename} (${imageType}) (attempt ${attempts})`);                                img.src = ''; // Cancel the request
                                
                                if (attempts < maxRetries) {
                                    setTimeout(attemptLoad, 1000 * attempts); // Progressive delay
                                } else {
                                    reject(new Error(`Timeout after ${maxRetries} attempts: ${filename} (${imageType})`));
                                }
                            }, timeout);
                            
                            img.src = src;
                        }
                        
                        attemptLoad();
                    });
                }
                
                // Validate images exist on server before attempting to load
                async function validateImageExists(filename, type) {
                    try {
                        const response = await fetch(`http://${FLASK_HOST}:${FLASK_PORT}/ai_smoke/validate_image/${type}/${filename}`);
                        if (response.ok) {
                            const result = await response.json();
                            return result.valid;
                        }
                        return false;
                    } catch (error) {
                        console.error(`Error validating image ${filename}:`, error);
                        return false;
                    }
                }
                
                const loadPromises = [];
                let validatedCount = 0;
                
                // Process input images
                for (const filename of data.input_images) {
                    const isValid = await validateImageExists(filename, 'input');
                    if (isValid) {
                        const src = `http://${FLASK_HOST}:${FLASK_PORT}/ai_smoke/images/input/${filename}`;
                        loadPromises.push(loadImageWithRetry(src, filename, 'input'));
                        validatedCount++;
                    } else {
                        console.warn(`Skipping invalid input image: ${filename}`);
                    }
                }

                // Process output images
                for (const filename of data.output_images) {
                    const isValid = await validateImageExists(filename, 'output');
                    if (isValid) {
                        const src = `http://${FLASK_HOST}:${FLASK_PORT}/ai_smoke/images/output/${filename}`;
                        loadPromises.push(loadImageWithRetry(src, filename, 'output'));
                        validatedCount++;
                    } else {
                        console.warn(`Skipping invalid output image: ${filename}`);
                    }
                }
                
                console.log(`Validated ${validatedCount}/${totalImages} images, starting download...`);
                updateStatus(`Loading ${validatedCount} validated images...`, 'running');
                
                // Track progress
                let loadedCount = 0;
                const progressPromises = loadPromises.map(promise => 
                    promise.then(result => {
                        loadedCount++;
                        const percentage = Math.round((loadedCount / validatedCount) * 100);
                        updateStatus(`Loading images... ${loadedCount}/${validatedCount} (${percentage}%)`, 'running');
                        return result;
                    }).catch(error => {
                        loadedCount++;
                        const percentage = Math.round((loadedCount / validatedCount) * 100);
                        updateStatus(`Loading images... ${loadedCount}/${validatedCount} (${percentage}%)`, 'running');
                        throw error;
                    })
                );
                
                // Wait for all images with detailed results
                const results = await Promise.allSettled(progressPromises);
                
                const successful = results.filter(r => r.status === 'fulfilled');
                const failed = results.filter(r => r.status === 'rejected');
                
                console.log(`Load completed: ${successful.length} successful, ${failed.length} failed`);
                
                // Log detailed failure information
                if (failed.length > 0) {
                    console.group('Failed image loads:');
                    failed.forEach((result, index) => {
                        console.error(`${index + 1}. ${result.reason.message}`);
                    });
                    console.groupEnd();
                }
                
                // Log successful loads with retsmall_obj_detectry information
                if (successful.length > 0) {
                    console.group('Successful image loads:');
                    successful.forEach(result => {
                        const { filename, imageType, attempts } = result.value;
                        if (attempts > 1) {
                            console.log(`${filename} (${imageType}) (required ${attempts} attempts)`);
                        }
                    });
                    console.groupEnd();
                }
                
                const successRate = Math.round((successful.length / validatedCount) * 100);
                
                if (failed.length === 0) {
                    // updateStatus(`All input images loaded successfully (${successful.length}/${validatedCount})`, 'ready');
                    updateStatus(`All input images loaded successfully`, 'ready');
                } else if (successful.length > 0) {
                    // updateStatus(`Images loaded: ${successful.length}/${validatedCount} (${successRate}%) - ${failed.length} failed`, 'ready');
                    updateStatus(`All input images loaded successfully`, 'ready');
                } else {
                    updateStatus('Failed to load input images - check console for details', 'error');
                }

                // Store validation results for later use
                window.imageValidationResults = {
                    total: validatedCount,
                    successful: successful.length,
                    failed: failed.length,
                    successRate: successRate
                };

                console.log('Input image load completed - ready for display');
                
                // numToCheck = 20;
                // const inputValidation = validateInputImages(numToCheck);

                // // Update final status based on validation
                // if (failed.length === 0 && inputValidation.success) {
                //     // updateStatus(`All input images loaded and validated successfully (${successful.length}/${validatedCount})`, 'ready');
                //     updateStatus(`All input images loaded and validated`, 'ready');
                //     console.log(`All first ${numToCheck} input images are present in cache`);
                // } else if (failed.length === 0 && !inputValidation.success) {
                //     updateStatus(`Input images loaded: ${successful.length}/${validatedCount} - Missing ${inputValidation.missing}/${numToCheck} input images`, 'error');
                //     console.warn(`Missing ${inputValidation.missing}/${numToCheck} input images`);
                // } else if (successful.length > 0) {
                //     updateStatus(`Input images loaded: ${successful.length}/${validatedCount} (${successRate}%) - ${failed.length} failed, ${inputValidation.missing}/${numToCheck} input missing`, 'error');
                //     console.warn(`Missing ${inputValidation.missing}/${numToCheck} input images`);
                // } else {
                //     updateStatus('Failed to load input images - check console for details', 'error');
                //     console.error('Failed to load input images - check console for details');
                // }
                                
            } catch (error) {
                console.error('Error in loading:', error);
                updateStatus('Error loading input images - check network connection', 'error');
            }
        }

        window.run_ai_smoke = function() {
            if (isRunning) return;
            
            isRunning = true;
            startTime = new Date();
            
            updateStatus('Starting ai smoke...', 'running');
            updateButtons();
            
            // Clear previous images
            clearImages();
            
            try {
                fetch(`http://${FLASK_HOST}:${FLASK_PORT}/send_message`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: `run_ai_smoke:${numAICoreRun}` })
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Command sent successfully:", data);
                    // startProgressPolling();
                    startLocalImageDisplay();
                    startCompletionPolling();
                })
                .catch(error => {
                    console.error("Error sending command:", error);
                    updateStatus('Error starting detection', 'error');
                    isRunning = false;
                    updateButtons();
                });
            } catch (error) {
                console.error("Error:", error);
                updateStatus('Error starting detection', 'error');
                isRunning = false;
                updateButtons();
            }
        }

        function startCompletionPolling() {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`http://${FLASK_HOST}:${FLASK_PORT}/ai_smoke/progress`);
                    const data = await response.json();
                    
                    if (data.type === 'ai_smoke_complete') {
                        handleCompletion();
                    } else if (data.type === 'ai_smoke_error') {
                        handleError(data.error);
                    }
                } catch (error) {
                    console.error('Error polling completion:', error);
                }
            }, 500); // Poll every 500ms
        }

                clearInterval(pollInterval);
                pollInterval = null;
            }

        function handleCompletion() {
            stopLocalImageDisplay();
            updateStatus('Detection completed successfully', 'ready');
            isRunning = false;
            updateButtons();
            stopProgressPolling();
        }

        function handleError(errorMsg) {
            stopLocalImageDisplay();
            updateStatus(`Error: ${errorMsg}`, 'error');
            isRunning = false;
            updateButtons();
            stopProgressPolling();
        }
        
        function displayImagePair(inputFilename, outputFilename) {
            console.log(`Displaying images: input=${inputFilename}, output=${outputFilename}`);
            const inputContainer = document.getElementById('inputImageContainer');
            const outputContainer = document.getElementById('outputImageContainer');
            const inputInfo = document.getElementById('inputImageInfo');
            const outputInfo = document.getElementById('outputImageInfo');
            
            // Function to create and display image with fallback
            function displayImage(filename, type, container, infoElement) {
                let cachedImg;
                
                // Get image from appropriate cache
                if (type === 'input') {
                    cachedImg = aiSmokeInputImageCache[filename];
                } else {
                    cachedImg = aiSmokeOutputImageCache[filename];
                }
                
                if (cachedImg && cachedImg.complete && cachedImg.naturalWidth > 0) {
                    // Create a new image element to display
                    const displayImg = document.createElement('img');
                    displayImg.src = cachedImg.src;
                    
                    container.innerHTML = '';
                    container.appendChild(displayImg);
                    // infoElement.textContent = `${type.charAt(0).toUpperCase() + type.slice(1)}: ${filename}`;
                    infoElement.textContent = ``;
                    
                    // Add error handling for display
                    displayImg.onerror = () => {
                        console.error(`Failed to display ${type} image: ${filename}`);
                        container.innerHTML = `<div class="ai-smoke-widget-image-placeholder">Failed to display ${type} image</div>`;
                    };
                    
                    return true;
                } else {
                    console.warn(`${type} image not available in cache: ${filename}`);
                    container.innerHTML = `<div class="ai-smoke-widget-image-placeholder">${type.charAt(0).toUpperCase() + type.slice(1)} image not available</div>`;
                    return false;
                }
            }
            
            // Display both images
            const inputDisplayed = displayImage(inputFilename, 'input', inputContainer, inputInfo);
            const outputDisplayed = displayImage(outputFilename, 'output', outputContainer, outputInfo);
            
            // Log display status
            if (inputDisplayed && outputDisplayed) {
                console.log(`Successfully displayed both images: ${inputFilename} and ${outputFilename}`);
            } else {
                console.warn(`Partial display: input=${inputDisplayed}, output=${outputDisplayed}`);
            }
        }

    </script>
</body>
</html>
