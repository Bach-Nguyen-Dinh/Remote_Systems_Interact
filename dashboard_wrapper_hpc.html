<body>

    <script>
        // Send heartbeat to demo launcher every 2 seconds
        const HEARTBEAT_URL = 'http://127.0.0.1:8765/heartbeat?tab=hpc';

        function sendHeartbeat() {
            fetch(HEARTBEAT_URL, { mode: 'cors' }).catch(() => {});

        // Send immediately and then every 2 seconds
        sendHeartbeat();
        setInterval(sendHeartbeat, 2000);
