<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Navigation Interface</title>
    <style>
        /* ------------------------------------------------------------------
           Grafana dark theme, matched to the rest of the Topaz dashboard
           (combined_dashboard.html / system_monitor.html / orientation.html):
           same tokens, same 13px Inter stack, same 3px radius. Declared in this
           page's own <style> rather than inherited from the shell, so the page
           still looks right opened directly at :5001/auto_nav_app.
           ------------------------------------------------------------------ */
        :root {
            --bg:            #020406;
            --panel-bg:      #111217;
            --border:        #28292f;
            --input-border:  #2c3235;
            --text:          rgba(204, 204, 220, 0.90);
            --text-weak:     rgba(204, 204, 220, 0.65);
            --text-faint:    rgba(204, 204, 220, 0.40);
            --blue:          #2372cc;
            --blue-hover:    #3696ff;
            --green:         #73bf69;
            --red:           #f2495c;
            --track:         #2c3036;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        .autoNav-widget-body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            padding: 10px 12px 16px;
        }

        /* Captions above each image (GPS / Features / Depth / LIDAR) read as
           panel titles, so they use the same size/weight/colour as
           system_monitor.html's .panel-title. */
        .autoNav-widget-body h3,
        .autoNav-widget-body h4,
        .autoNav-widget-body h5 {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-weak);
        }
        .autoNav-widget-body p { margin: 6px 0; }
        .autoNav-widget-body strong { font-weight: 500; color: var(--text-weak); }

        .autoNav-widget-button-container button {
            background-color: var(--blue);
            color: #fff;
            border: none;
            height: 32px;
            padding: 0 16px;
            margin: 0 4px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: background-color .15s ease;
        }

        .autoNav-widget-button-container button:hover:not(:disabled) {
            background-color: var(--blue-hover);
        }

        .autoNav-widget-button-container button:disabled {
            background-color: #6b7a8f;
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Combined Stop/Clear button - red, matching the HPC SAR Reset/Stop button
           (.buttonRed-sar in index/hpc/sar_process_reset.html). */
        .autoNav-widget-button-container button.autoNav-widget-button-red {
            background-color: #ca2715;
        }

        .autoNav-widget-button-container button.autoNav-widget-button-red:hover:not(:disabled) {
            background-color: #ff4c47;
        }

        /* Status line: green only for the 'ready' type updateStatus() passes,
           red for everything else, on the dashboard's own palette. */
        .autoNav-widget-status-bar {
            background-color: transparent;
            padding: 6px 10px;
            border-radius: 3px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--red);
        }
        .autoNav-widget-status-bar.ready { color: var(--green); }

        .autoNav-widget-image-display {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .autoNav-widget-column-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .autoNav-widget-left-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 600px;
            flex-shrink: 0;
        }

        .autoNav-widget-right-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .autoNav-widget-image-panel {
            flex: 1;
            /* Flex items default to min-width:auto, which would let a wide image
               push the panel past the Grafana panel's width instead of shrinking. */
            min-width: 0;
            text-align: center;
        }

        .autoNav-widget-image-container {
            border: 1px solid var(--border);
            border-radius: 3px;
            /* padding: 10px; */
            background-color: var(--panel-bg);
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fill the frame rather than sizing to the image, so the frames keep the
           size they have while idle once the display loop starts swapping frames
           in. Every size below belongs to a container, never to an img. */
        .autoNav-widget-image-container img {
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100%;
            object-fit: fill;
            border-radius: 3px;
        }

        /* Left column images (GPS, Feature, Depth) - fixed size */
        .autoNav-widget-left-column .autoNav-widget-image-container {
            height: 300px;
        }

        /* Right column LIDAR image - fills column */
        .autoNav-widget-right-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .autoNav-widget-right-column .autoNav-widget-image-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* flex:1 (basis 0) overrides the 500px above: the LIDAR frame takes
           whatever height the left column's stack gives the row. */
        .autoNav-widget-right-column .autoNav-widget-image-container {
            flex: 1;
        }

        .autoNav-widget-image-placeholder {
            color: var(--text-faint);
            font-style: italic;
            font-size: 12px;
        }
        .autoNav-widget-control-panel {
            display: flex;
        }
        
        .autoNav-widget-button-container {
            flex: 1;
            margin-top: 20px;
            text-align: center;
        }
        
        .autoNav-widget-progress-info {
            flex: 1;
            background-color: transparent;
            /* padding: 15px; */
            border-radius: 3px;
            /* margin-top: 20px; */
        }

        .autoNav-widget-container {
            /* max-width: 1200px; */
            margin: 0 auto;
            border-radius: 3px;
        }
    </style>
</head>
<body class="autoNav-widget-body">
    <div class="autoNav-widget-container">
        <div class="autoNav-widget-column-container">
            <!-- Left Column: GPS, Feature, Depth stacked vertically -->
            <div class="autoNav-widget-left-column">
                <div class="autoNav-widget-image-panel">
                    <h5>GPS</h5>
                    <div class="autoNav-widget-image-container" id="gpsImageContainer">
                        <div class="autoNav-widget-image-placeholder">No data</div>
                    </div>
                    <p id="gpsImageInfo"></p>
                </div>
                <div class="autoNav-widget-image-panel">
                    <h5>Features</h5>
                    <div class="autoNav-widget-image-container" id="featureImageContainer">
                        <div class="autoNav-widget-image-placeholder">No data</div>
                    </div>
                    <p id="featureImageInfo"></p>
                </div>
                <div class="autoNav-widget-image-panel">
                    <h5>Depth</h5>
                    <div class="autoNav-widget-image-container" id="depthImageContainer">
                        <div class="autoNav-widget-image-placeholder">No data</div>
                    </div>
                    <p id="depthImageInfo"></p>
                </div>
            </div>

            <!-- Right Column: LIDAR -->
            <div class="autoNav-widget-right-column">
                <div class="autoNav-widget-image-panel">
                    <h5>LIDAR</h5>
                    <div class="autoNav-widget-image-container" id="lidarImageContainer">
                        <div class="autoNav-widget-image-placeholder">No data</div>
                    </div>
                    <p id="lidarImageInfo"></p>
                </div>
            </div>
        </div>

        <div class="autoNav-widget-control-panel">
            <div class="autoNav-widget-button-container">
                <button id="fetchBtn_autoNav" onclick="preloadImages()">Fetch</button>
                <!-- Run/Clear start disabled: there is nothing to run or clear until
                     Fetch has cached the frames. updateButtons() owns them from then
                     on; the attribute here just avoids a flash of enabled buttons
                     before the script runs. -->
                <button id="runBtn_autoNav" onclick="run_auto_nav()" disabled>Run</button>
                <!-- Doubles as Stop while playback is running (see updateButtons) -->
                <button id="clearBtn_autoNav" class="autoNav-widget-button-red" onclick="clear_or_stop_auto_nav()" disabled>Clear</button>

                <div id="statusBar" class="autoNav-widget-status-bar">Click "Fetch" to provide data to AI</div>
                <p><strong>Processing Time:</strong> <span id="processingTime">-</span></p>
            </div>
        
            <!-- <div class="autoNav-widget-progress-info">
                <h4>Processing Information</h4>
                <p><strong>Current Status:</strong> <span id="processStatus">Idle</span></p>
                <p><strong>Latest Output:</strong> <span id="latestOutput">None</span></p>
            </div> -->
        </div>

    </div>

    <script>
        let autoNavGpsImageCache = {};
        let autoNavFeaturesImageCache = {};
        let autoNavDepthImageCache = {};
        let autoNavLidarImageCache = {};
        
    (function() {
        'use strict';
        // All backend URLs below are RELATIVE (no leading slash, no host:port) so
        // they resolve against whatever origin/prefix this page was served from --
        // either http://<box>:5001/ or behind the nginx /topaz/ prefix. See
        // set_up_proxy_server.md and combined_dashboard.html.
        
        // let autoNavGpsImageCache = {};
        // let autoNavFeaturesImageCache = {};
        // let autoNavDepthImageCache = {};
        // let autoNavLidarImageCache = {};
        
        let isRunning = false;
        let startTime = null;
        let pollInterval = null;
        let displayInterval = null;

        // Held down for the duration of a preload so a double-click can't start a
        // second fetch over the top of the first. Not persisted anywhere — a reload
        // empties the caches, so the new page must be allowed to fetch again.
        let isFetching = false;

        // // Preload all images when page loads
        // window.addEventListener('load', function() {
        //     preloadImages();
        // });

        function clearImages() {
            document.getElementById('gpsImageContainer').innerHTML = '<div class="autoNav-widget-image-placeholder">No data</div>';
            document.getElementById('featureImageContainer').innerHTML = '<div class="autoNav-widget-image-placeholder">No data</div>';
            document.getElementById('depthImageContainer').innerHTML = '<div class="autoNav-widget-image-placeholder">No data</div>';
            document.getElementById('lidarImageContainer').innerHTML = '<div class="autoNav-widget-image-placeholder">No data</div>';
            document.getElementById('gpsImageInfo').textContent = '';
            document.getElementById('featureImageInfo').textContent = '';
            document.getElementById('depthImageInfo').textContent = '';
            document.getElementById('lidarImageInfo').textContent = '';
        }

        function updateStatus(message, type = '') {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = message;
            statusBar.className = `autoNav-widget-status-bar ${type}`;
        }

        // Are all four frame sets already preloaded? Clear() deliberately keeps the
        // caches, so this stays true after a Clear and both the button states and
        // the status line have to agree on it.
        function hasCachedImages() {
            return Object.keys(autoNavGpsImageCache).length > 0 &&
                   Object.keys(autoNavFeaturesImageCache).length > 0 &&
                   Object.keys(autoNavDepthImageCache).length > 0 &&
                   Object.keys(autoNavLidarImageCache).length > 0;
        }

        function updateButtons() {
            const fetchBtn_autoNav = document.getElementById('fetchBtn_autoNav');
            const runBtn_autoNav = document.getElementById('runBtn_autoNav');
            const clearBtn_autoNav = document.getElementById('clearBtn_autoNav');

            const hasImagesInMemory = hasCachedImages();

            // Retired for the rest of the page's life once the frames are cached,
            // and held down while a preload is in flight.
            fetchBtn_autoNav.disabled = isFetching || isRunning || hasImagesInMemory;

            // Run button: enabled if images in memory and not running
            runBtn_autoNav.disabled = !hasImagesInMemory || isRunning;

            // One button, two jobs — same pattern as the small-object panel's
            // Clear/Stop: "Stop" halts the playback, "Clear" wipes the displayed
            // frames once nothing is running. Nothing to stop or wipe until Fetch
            // has cached something, so it stays down until then.
            clearBtn_autoNav.textContent = isRunning ? 'Stop' : 'Clear';
            clearBtn_autoNav.disabled = !hasImagesInMemory;
        }

        function updateProcessingTime() {
            if (startTime) {
                const elapsed = Math.floor((new Date() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('processingTime').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }
        
        window.preloadImages = async function() {
            if (isFetching || hasCachedImages()) return;
            isFetching = true;
            updateButtons();

            try {
                console.log('Starting image preload...');
                updateStatus('Loading image list...', 'running');

                const response = await fetch(`auto_nav/image_list`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch image list: ${response.status}`);
                }

                const data = await response.json();
                console.log('Image list received:', data);

                const totalImages = data.gps_images.length + data.features_images.length +
                                    data.depth_images.length + data.lidar_images.length;
                // One percentage over the whole download. Repaint only when the
                // whole number changes.
                let loadedCount = 0;
                let lastPercent = -1;
                function reportProgress(percent) {
                    percent = Math.round(percent);
                    if (percent === lastPercent) return;
                    lastPercent = percent;
                    updateStatus(`Loading input data ... ${percent}%`, 'running');
                }
                function noteLoaded() {
                    // Clamped: if a chunk is retried, or the per-frame fallback
                    // takes over after some frames already arrived, late callbacks
                    // must not push the percentage past 100.
                    if (loadedCount < totalImages) loadedCount++;
                    reportProgress((loadedCount / totalImages) * 100);
                }

                reportProgress(0);

                // Enhanced image loading with retry mechanism
                function loadImageWithRetry(src, filename, imageType, maxRetries = 3, timeout = 15000) {
                    return new Promise((resolve, reject) => {
                        let attempts = 0;
                        
                        function attemptLoad() {
                            attempts++;
                            console.log(`Attempting to load ${filename} (${imageType}) (attempt ${attempts}/${maxRetries})`);                            
                            const img = new Image();
                            let timeoutId;
                            
                            img.onload = () => {
                                clearTimeout(timeoutId);
                                console.log(`✓ Loaded: ${filename} (${imageType})`);
                                
                                // Validate that the image actually loaded with content
                                if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                                    // Store in appropriate cache
                                    if (imageType === 'gps_img') {
                                        autoNavGpsImageCache[filename] = img;
                                    } else if (imageType === 'features_img') {
                                        autoNavFeaturesImageCache[filename] = img;
                                    } else if (imageType === 'depth_img') {
                                        autoNavDepthImageCache[filename] = img;
                                    } else if (imageType === 'lidar_img') {
                                        autoNavLidarImageCache[filename] = img;
                                    }
                                    resolve({ success: true, filename, imageType, attempts });
                                } else {
                                    console.warn(`⚠ Image loaded but has no dimensions: ${filename} (${imageType})`);
                                    if (attempts < maxRetries) {
                                        setTimeout(attemptLoad, 1000 * attempts);
                                    } else {
                                        reject(new Error(`Image has no dimensions after ${maxRetries} attempts: ${filename} (${imageType})`));
                                    }
                                }
                            };
                            
                            img.onerror = () => {
                                clearTimeout(timeoutId);
                                console.error(`✗ Failed to load: ${filename} (${imageType}) (attempt ${attempts})`);
                                
                                if (attempts < maxRetries) {
                                    setTimeout(attemptLoad, 1000 * attempts);
                                } else {
                                    reject(new Error(`Failed to load after ${maxRetries} attempts: ${filename} (${imageType})`));
                                }
                            };
                            
                            // Set timeout for this attempt
                            timeoutId = setTimeout(() => {
                                console.warn(`⚠ Timeout loading: ${filename} (${imageType}) (attempt ${attempts})`);
                                img.src = ''; // Cancel the request
                                
                                if (attempts < maxRetries) {
                                    setTimeout(attemptLoad, 1000 * attempts); // Progressive delay
                                } else {
                                    reject(new Error(`Timeout after ${maxRetries} attempts: ${filename} (${imageType})`));
                                }
                            }, timeout);
                            
                            img.src = src;
                        }
                        
                        attemptLoad();
                    });
                }
                
                // ---- bundled preload ----
                // Frames used to be fetched one at a time, each preceded by a
                // validate_image probe, so a stream cost two round trips per frame
                // *in series*. That is invisible on the LAN but a round trip to
                // this server measures ~1 s from the other side of the world, and
                // this page alone has ~1500 frames — tens of minutes of pure
                // waiting. Ask for a batch of frames per request instead and cut
                // the response up here. The probe is gone with it: /image_list only
                // ever lists frames the server already stat'd as readable.
                //
                // Chunks are paced, and the whole page shares one concurrency
                // budget. This is what keeps the 1 s /system_metrics poll alive
                // during a Fetch: every response on this origin shares a single
                // HTTP/2 connection, so whatever frame data is already queued sits
                // in front of that poll and delays it by however long the link needs
                // to drain it.
                //
                // The budget is a TIME, not a byte count, because the link is not a
                // fixed speed: the same page measured 105 KB/s from Oregon in one
                // session and 6 KB/s in the next. 192 KB is a second of pipe on the
                // first and half a minute on the second, which is how a fixed chunk
                // size still let metrics polls stall 44 s. Size each chunk from the
                // speed the previous ones actually achieved instead, so the bytes in
                // flight stay near BUNDLE_TARGET_SECONDS x BUNDLE_PARALLEL of pipe
                // time whatever the link is doing that day.
                const BUNDLE_TARGET_SECONDS = 1.2;        // pipe time per request
                const BUNDLE_MIN_BYTES = 8 * 1024;        // sanity floor, not a target
                const BUNDLE_MAX_BYTES = 512 * 1024;      // must not devolve to per-frame
                const BUNDLE_PARALLEL = 2;                // requests in flight, page-wide
                const BUNDLE_MAX_FILES = 500;             // server's own per-request cap
                const BUNDLE_RETRIES = 3;                 // attempts per chunk

                // Speed is measured as plain goodput: bytes landed over wall clock.
                // Deliberately NOT by timing one response body -- anything that
                // buffers a small response and releases it in one burst (a proxy, a
                // TLS record boundary) makes a single-body measurement read as
                // instantaneous and the estimate runs away. Wall clock cannot be
                // fooled that way, and because it charges the round trips to the
                // link as well it only ever errs low, which costs a round trip
                // rather than a stall.
                //
                // Settling point, with a round trip R and a link speed L: a chunk
                // takes R + B/L, PARALLEL of them are in flight, so the measured
                // rate is P*B/(R + B/L) and B = TARGET * that rate. For P = 2 and
                // TARGET = 1.2 that solves to B = 1.4*L -- about 1.4 s of pipe per
                // chunk and under 3 s in flight, whatever L turns out to be.
                let bundleWindowAt = 0;                   // start of current window
                let bundleWindowBytes = 0;
                let bundleRate = 0;                       // bytes/sec, 0 until measured

                function chunkBudget() {
                    const elapsed = bundleWindowAt ? (performance.now() - bundleWindowAt) / 1000 : 0;
                    // A window is worth believing once it spans a round trip and a
                    // chunk. Roll it afterwards so the estimate follows the link's
                    // current speed instead of averaging in the slow ramp at the
                    // start.
                    if (elapsed >= 2 && bundleWindowBytes >= BUNDLE_MIN_BYTES) {
                        bundleRate = bundleWindowBytes / elapsed;
                        bundleWindowAt = performance.now();
                        bundleWindowBytes = 0;
                    }
                    if (!bundleRate) return BUNDLE_MIN_BYTES;
                    return Math.max(BUNDLE_MIN_BYTES,
                                    Math.min(BUNDLE_MAX_BYTES,
                                             Math.round(bundleRate * BUNDLE_TARGET_SECONDS)));
                }

                // A dropped connection is routine on a long-haul link. Retrying the
                // one chunk that failed costs a couple of hundred KB; letting the
                // error escape drops the whole page onto the per-frame fallback and
                // its ~1500 round trips, which is the slow path we came here to
                // remove.
                async function fetchChunk(url) {
                    if (!bundleWindowAt) bundleWindowAt = performance.now();
                    let lastError;
                    for (let attempt = 1; attempt <= BUNDLE_RETRIES; attempt++) {
                        try {
                            const response = await fetch(url);
                            if (!response.ok) {
                                throw new Error(`Bundle request failed: ${response.status}`);
                            }
                            const buffer = await response.arrayBuffer();
                            bundleWindowBytes += buffer.byteLength;
                            return buffer;
                        } catch (error) {
                            lastError = error;
                            console.warn(`Bundle chunk attempt ${attempt}/${BUNDLE_RETRIES} failed:`, error);
                            if (attempt < BUNDLE_RETRIES) {
                                await new Promise(resolve => setTimeout(resolve, 500 * attempt));
                            }
                        }
                    }
                    throw lastError;
                }

                const AUTO_NAV_STREAMS = [
                    { kind: 'gps', imageType: 'gps_img', cache: autoNavGpsImageCache,
                      filenames: data.gps_images, infos: data.gps_images_info },
                    { kind: 'features', imageType: 'features_img', cache: autoNavFeaturesImageCache,
                      filenames: data.features_images, infos: data.features_images_info },
                    { kind: 'depth', imageType: 'depth_img', cache: autoNavDepthImageCache,
                      filenames: data.depth_images, infos: data.depth_images_info },
                    { kind: 'lidar', imageType: 'lidar_img', cache: autoNavLidarImageCache,
                      filenames: data.lidar_images, infos: data.lidar_images_info },
                ];

                // Take as many frames as the budget allows right now. Chunks are cut
                // at dequeue time rather than planned upfront so each one uses the
                // newest speed estimate. Sizes come from /image_list, which already
                // reports them per frame.
                function nextChunk(stream) {
                    if (stream.cursor >= stream.infos.length) return null;
                    const budget = chunkBudget();
                    const start = stream.cursor;
                    let bytes = 0;
                    let count = 0;
                    while (start + count < stream.infos.length && count < BUNDLE_MAX_FILES) {
                        const size = stream.infos[start + count].size || 0;
                        // A frame larger than the whole budget still gets a chunk of
                        // its own rather than stalling the queue.
                        if (count > 0 && bytes + size > budget) break;
                        bytes += size;
                        count++;
                    }
                    stream.cursor = start + count;
                    return { start: start, count: count };
                }

                // Cut one bundle body up into the cache. Resolves once every frame
                // in it has decoded, so Run can display any of them straight away.
                // Yields allSettled-shaped entries so the reporting below is
                // identical whichever path we took.
                function unpackBundle(buffer, stream) {
                    const headerLength = new DataView(buffer).getUint32(0);
                    const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, 4, headerLength)));
                    const imageType = stream.imageType;

                    let offset = 4 + headerLength;
                    return Promise.all(header.files.map(entry => {
                        const filename = entry.name;
                        const start = offset;
                        offset += entry.size;

                        // size 0 means the file vanished between the listing and
                        // the bundle; it contributes no bytes, so just skip it.
                        if (entry.size === 0) {
                            noteLoaded();
                            return Promise.resolve({ status: 'rejected', reason: new Error(`Missing on server: ${filename} (${imageType})`) });
                        }

                        const blob = new Blob([new Uint8Array(buffer, start, entry.size)], { type: 'image/webp' });
                        const url = URL.createObjectURL(blob);
                        return new Promise(resolve => {
                            const img = new Image();
                            img.onload = () => {
                                stream.cache[filename] = img;
                                noteLoaded();
                                resolve({ status: 'fulfilled', value: { filename, imageType, attempts: 1 } });
                            };
                            img.onerror = () => {
                                URL.revokeObjectURL(url);
                                noteLoaded();
                                resolve({ status: 'rejected', reason: new Error(`Corrupt frame: ${filename} (${imageType})`) });
                            };
                            img.src = url;
                        });
                    }));
                }

                // All four streams feed ONE queue drained by BUNDLE_PARALLEL
                // workers. Giving each stream its own budget is what let a wall of
                // requests go out together and buried the metrics poll.
                async function loadInBundles(streams) {
                    for (const stream of streams) stream.cursor = 0;
                    const results = [];
                    let at = 0;

                    async function worker() {
                        while (true) {
                            // Cutting the chunk is synchronous, so two workers can
                            // never be handed the same frames.
                            let stream = null;
                            let chunk = null;
                            while (at < streams.length) {
                                chunk = nextChunk(streams[at]);
                                if (chunk) { stream = streams[at]; break; }
                                at++;
                            }
                            if (!chunk) return;
                            const buffer = await fetchChunk(
                                `auto_nav/image_bundle/${stream.imageType}?start=${chunk.start}&count=${chunk.count}`);
                            results.push(await unpackBundle(buffer, stream));
                        }
                    }

                    const workers = [];
                    for (let i = 0; i < BUNDLE_PARALLEL; i++) {
                        workers.push(worker());
                    }
                    await Promise.all(workers);
                    return [].concat.apply([], results);
                }

                // Kept for a server that predates /image_bundle. Still one round
                // trip per frame, but they all go at once rather than in series.
                function loadOneByOne() {
                    const promises = [];
                    for (const stream of AUTO_NAV_STREAMS) {
                        for (const filename of stream.filenames) {
                            promises.push(loadImageWithRetry(
                                `auto_nav/images/${stream.kind}/${filename}`, filename, stream.imageType));
                        }
                    }
                    return Promise.allSettled(promises.map(promise =>
                        promise.then(result => { noteLoaded(); return result; },
                                     error => { noteLoaded(); throw error; })
                    ));
                }

                const validatedCount = totalImages;
                let results;
                try {
                    results = await loadInBundles(AUTO_NAV_STREAMS);
                } catch (bundleError) {
                    console.warn('Bundled preload unavailable, falling back to per-frame loads:', bundleError);
                    loadedCount = 0;
                    lastPercent = -1;
                    results = await loadOneByOne();
                }

                const successful = results.filter(r => r.status === 'fulfilled');
                const failed = results.filter(r => r.status === 'rejected');
                
                console.log(`Load completed: ${successful.length} successful, ${failed.length} failed`);

                // Warm the frames before the first Run, not during it. Loading a
                // frame only gets its bytes into a Blob; the paintable form is
                // built on FIRST display, so the whole cost lands on run 1 and
                // none of it on run 2 — which is what makes a first run stutter
                // while later ones look smooth. Measured on the small-object set:
                // 0.66ms per frame first time vs 0.04ms after. decode() does that
                // work on demand, so spend it here where the user is already
                // waiting for Fetch. This page shows four streams at once, so it
                // has four caches to warm rather than two. See the fuller note in
                // index_grafana_topaz_small_object.html.
                const PREWARM_BATCH = 32;
                const toWarm = Object.values(autoNavGpsImageCache)
                    .concat(Object.values(autoNavFeaturesImageCache))
                    .concat(Object.values(autoNavDepthImageCache))
                    .concat(Object.values(autoNavLidarImageCache));
                if (toWarm.length) {
                    updateStatus('Preparing frames for display...', 'running');
                    const warmStarted = performance.now();
                    for (let i = 0; i < toWarm.length; i += PREWARM_BATCH) {
                        await Promise.all(toWarm.slice(i, i + PREWARM_BATCH).map(
                            img => (img && img.decode) ? img.decode().catch(() => {})
                                                       : Promise.resolve()));
                        // Reported per batch, not per frame: large sets take
                        // seconds here (the four auto-nav streams are ~8s), and a
                        // silent pause at the end of Fetch reads as a hang.
                        updateStatus(`Preparing frames for display ... ${Math.round(100 * (i + PREWARM_BATCH) / toWarm.length)}%`, 'running');
                    }
                    console.log(`Pre-warmed ${toWarm.length} frames in ${(performance.now() - warmStarted).toFixed(0)}ms`);
                }

                // Log detailed failure information
                if (failed.length > 0) {
                    console.group('Failed image loads:');
                    failed.forEach((result, index) => {
                        console.error(`${index + 1}. ${result.reason.message}`);
                    });
                    console.groupEnd();
                }
                
                // Log successful loads with retry information
                if (successful.length > 0) {
                    console.group('Successful image loads:');
                    successful.forEach(result => {
                        const { filename, imageType, attempts } = result.value;
                        if (attempts > 1) {
                            console.log(`${filename} (${imageType}) (required ${attempts} attempts)`);
                        }
                    });
                    console.groupEnd();
                }
                
                const successRate = Math.round((successful.length / validatedCount) * 100);

                if (failed.length === 0) {
                    updateStatus(`All input loaded`, 'ready');
                } else if (successful.length > 0) {
                    updateStatus(`Images loaded: ${successful.length}/${validatedCount} (${successRate}%)`, 'ready');
                } else {
                    updateStatus('Failed to load images - check console for details', 'error');
                }

                updateButtons();

                // Store validation results for later use
                window.imageValidationResults = {
                    total: validatedCount,
                    successful: successful.length,
                    failed: failed.length,
                    successRate: successRate
                };

                console.log('Image preload completed - ready for display');
                console.log('Cache status:', {
                    gps: Object.keys(autoNavGpsImageCache).length,
                    features: Object.keys(autoNavFeaturesImageCache).length,
                    depth: Object.keys(autoNavDepthImageCache).length,
                    lidar: Object.keys(autoNavLidarImageCache).length
                });
                
                // numToCheck = 300;
                // // Validate first 100 input images
                // const inputValidation = validateFirst100InputImages(numToCheck);

                // // Update final status based on validation
                // if (failed.length === 0 && inputValidation.success) {
                //     // updateStatus(`All input images loaded and validated successfully (${successful.length}/${validatedCount})`, 'ready');
                //     updateStatus(`All input images loaded and validated`, 'ready');
                //     console.log(`All first ${numToCheck} input images are present in cache`);
                // } else if (failed.length === 0 && !inputValidation.success) {

                //     console.warn(`Missing ${inputValidation.missing}/${numToCheck} input images`);
                // } else if (successful.length > 0) {
                //     updateStatus(`Input images loaded: ${successful.length}/${validatedCount} (${successRate}%) - ${failed.length} failed, ${inputValidation.missing}/${numToCheck} input missing`, 'error');
                //     console.warn(`Missing ${inputValidation.missing}/${numToCheck} input images`);
                // } else {
                //     updateStatus('Failed to load input images - check console for details', 'error');
                //     console.error('Failed to load input images - check console for details');
                // }
                                
            } catch (error) {
                console.error('Error in loading:', error);
                updateStatus('Error loading input images - check network connection', 'error');
            } finally {
                // A failed preload leaves the caches empty, so this hands Fetch back
                // for a retry rather than stranding the panel with everything down.
                isFetching = false;
                updateButtons();
            }
        }

        window.run_auto_nav = function() {
            if (isRunning) return;

            isRunning = true;
            startTime = new Date();

            updateStatus('Running autonomous navigation ...', 'running');
            updateButtons();

            // Start cycling through images
            startImageDisplay();

            // Optionally notify backend
            fetch(`send_message`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: "run_auto_nav" })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Run command sent successfully:", data);
            })
            .catch(error => {
                console.error("Error sending run command:", error);
            });
        }

        function startImageDisplay() {
            // IMPORTANT: Clear any existing interval first to prevent multiple intervals running
            if (displayInterval) {
                clearInterval(displayInterval);
                displayInterval = null;
            }

            // Smart sorting function that detects naming patterns and sorts accordingly
            function smartSort(filenameArray) {
                if (filenameArray.length === 0) return [];

                // Detect the naming pattern from the first file
                const sample = filenameArray[0];

                // Pattern 1: Timestamp-based (e.g., vins_depth_1317020576.190.webp)
                // Extract floating-point timestamp at the end
                const timestampPattern = /_(\d+\.\d+)\.webp$/;

                // Pattern 2: Simple numeric (e.g., 1.webp, 2.webp, 100.webp)
                const simpleNumPattern = /^(\d+)\.webp$/;

                // Pattern 3: Number with suffix letter (e.g., gps_map_3s.webp, image_40s.webp)
                const numWithSuffixPattern = /_(\d+)[a-z]\.webp$/;

                // Pattern 4: Prefix with number (e.g., image_123.webp)
                const prefixNumPattern = /_(\d+)\.webp$/;

                if (timestampPattern.test(sample)) {
                    // Sort by timestamp (floating point)
                    return filenameArray.sort((a, b) => {
                        const timestampA = parseFloat(a.match(timestampPattern)[1]);
                        const timestampB = parseFloat(b.match(timestampPattern)[1]);
                        return timestampA - timestampB;
                    });
                } else if (simpleNumPattern.test(sample)) {
                    // Sort by simple number
                    return filenameArray.sort((a, b) => {
                        const numA = parseInt(a.match(simpleNumPattern)[1]);
                        const numB = parseInt(b.match(simpleNumPattern)[1]);
                        return numA - numB;
                    });
                } else if (numWithSuffixPattern.test(sample)) {
                    // Sort by number (ignoring suffix letter like 's')
                    return filenameArray.sort((a, b) => {
                        const numA = parseInt(a.match(numWithSuffixPattern)[1]);
                        const numB = parseInt(b.match(numWithSuffixPattern)[1]);
                        return numA - numB;
                    });
                } else if (prefixNumPattern.test(sample)) {
                    // Sort by number after prefix
                    return filenameArray.sort((a, b) => {
                        const numA = parseInt(a.match(prefixNumPattern)[1]);
                        const numB = parseInt(b.match(prefixNumPattern)[1]);
                        return numA - numB;
                    });
                } else {
                    // Fallback: alphabetical sort
                    return filenameArray.sort();
                }
            }

            // Apply smart sorting to all image caches
            const gpsImages = smartSort(Object.keys(autoNavGpsImageCache));
            const featuresImages = smartSort(Object.keys(autoNavFeaturesImageCache));
            const depthImages = smartSort(Object.keys(autoNavDepthImageCache));
            const lidarImages = smartSort(Object.keys(autoNavLidarImageCache));

            console.log('Starting image display with cached images:');
            console.log(`GPS: ${gpsImages.length}, Features: ${featuresImages.length}, Depth: ${depthImages.length}, LIDAR: ${lidarImages.length}`);

            // Check if we have images in all caches
            if (gpsImages.length === 0 || featuresImages.length === 0 ||
                depthImages.length === 0 || lidarImages.length === 0) {
                console.error('Missing images in one or more caches');
                updateStatus('Error: Missing images in cache', 'error');
                isRunning = false;
                updateButtons();
                return;
            }

            // The four panels are concurrent sensor streams of the same run but hold
            // different numbers of frames. Each panel advances at its own natural rate
            // (one frame per tick) and playback stops as soon as the shortest stream
            // runs out, so all four panels finish together. The extra tail frames in
            // the longer streams are not shown.
            const totalFrames = Math.min(gpsImages.length, featuresImages.length,
                                         depthImages.length, lidarImages.length);
            console.log(`Playing ${totalFrames} frames (shortest stream); all panels stop together`);

            function frameAt(filenames, index) {
                return filenames[index];
            }

            let currentIndex = 0;

            function displayNextSet() {
                if (!isRunning) return;

                // Playback finished - every panel has shown its last frame
                if (currentIndex >= totalFrames) {
                    finishImageDisplay();
                    return;
                }

                const gpsFilename = frameAt(gpsImages, currentIndex);
                const featuresFilename = frameAt(featuresImages, currentIndex);
                const depthFilename = frameAt(depthImages, currentIndex);
                const lidarFilename = frameAt(lidarImages, currentIndex);

                // Debug logging
                console.log(`Displaying frame ${currentIndex + 1}/${totalFrames}: features=${featuresFilename}`);

                displayImages(gpsFilename, featuresFilename, depthFilename, lidarFilename);

                updateProcessingTime();

                currentIndex++;
            }

            function finishImageDisplay() {
                if (displayInterval) {
                    clearInterval(displayInterval);
                    displayInterval = null;
                }
                isRunning = false;
                console.log(`Playback complete - displayed all ${totalFrames} frames`);
                updateStatus(`Completed`, 'ready');
                updateButtons();
            }

            // Display first set immediately
            displayNextSet();

            displayInterval = setInterval(displayNextSet, 100);
        }

        // The Clear button's click handler: it is labelled "Stop" while playback is
        // in flight, so route to whichever action the label promises.
        window.clear_or_stop_auto_nav = function() {
            if (isRunning) {
                stop_auto_nav();
            } else {
                clear_auto_nav();
            }
        }

        // Purely client-side: this demo replays cached frames, there is no process
        // on the target to abort, so no stop/terminate command is sent. The
        // displayed frames are left on screen — the button reverts to "Clear",
        // which is what wipes them.
        window.stop_auto_nav = function() {
            if (!isRunning) return;

            isRunning = false;

            // Stop the display interval
            if (displayInterval) {
                clearInterval(displayInterval);
                displayInterval = null;
            }

            updateStatus('Stopped', 'ready');
            updateButtons();
        }

        window.clear_auto_nav = function() {
            // Stop everything first
            isRunning = false;
            startTime = null;

            // Stop the display interval
            if (displayInterval) {
                clearInterval(displayInterval);
                displayInterval = null;
            }

            // DO NOT clear image caches - keep them in memory for faster restart
            // Only clear the displayed images

            clearImages();
            // The caches survive a Clear, so Fetch stays disabled — don't tell the
            // user to click it. With data still in memory the panel is simply ready
            // to Run again; the Fetch prompt only applies if nothing was fetched yet.
            updateStatus(hasCachedImages() ? 'Cleared' : 'Click "Fetch" to provide data to AI', 'ready');
            updateButtons();

            document.getElementById('processingTime').textContent = '-';

            // Send clear command to server
            fetch(`send_message`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: "clear_auto_nav" })
            })
            .catch(error => console.error("Error sending clear command:", error));
        }

        function displayImages(gpsFilename, featuresFilename, depthFilename, lidarFilename) {
            const gpsContainer = document.getElementById('gpsImageContainer');
            const featuresContainer = document.getElementById('featureImageContainer');
            const depthContainer = document.getElementById('depthImageContainer');
            const lidarContainer = document.getElementById('lidarImageContainer');
            const gpsInfo = document.getElementById('gpsImageInfo');
            const featuresInfo = document.getElementById('featureImageInfo');
            const depthInfo = document.getElementById('depthImageInfo');
            const lidarInfo = document.getElementById('lidarImageInfo');

            // Function to display image - reuses same img element (Option 5)
            function displayImage(filename, type, container, infoElement) {
                let cachedImg;

                // Get image from appropriate cache
                if (type === 'gps') {
                    cachedImg = autoNavGpsImageCache[filename];
                } else if (type === 'features') {
                    cachedImg = autoNavFeaturesImageCache[filename];
                } else if (type === 'depth') {
                    cachedImg = autoNavDepthImageCache[filename];
                } else if (type === 'lidar') {
                    cachedImg = autoNavLidarImageCache[filename];
                }

                if (cachedImg && cachedImg.complete && cachedImg.naturalWidth > 0) {
                    // Check if img element already exists in container
                    let displayImg = container.querySelector('img');

                    if (displayImg) {
                        // Reuse existing img element - just swap src
                        displayImg.src = cachedImg.src;
                    } else {
                        // First time: create new img element
                        container.innerHTML = '';
                        displayImg = document.createElement('img');
                        displayImg.src = cachedImg.src;
                        container.appendChild(displayImg);

                        // Add error handling
                        displayImg.onerror = () => {
                            console.error(`Failed to display ${type} image: ${filename}`);
                            container.innerHTML = `<div class="autoNav-widget-image-placeholder">Failed to display ${type} image</div>`;
                        };
                    }

                    infoElement.textContent = '';
                    return true;
                } else {
                    console.warn(`${type} image not available in cache: ${filename}`);
                    container.innerHTML = `<div class="autoNav-widget-image-placeholder">${type} image not available</div>`;
                    return false;
                }
            }

            // Display all four images
            displayImage(gpsFilename, 'gps', gpsContainer, gpsInfo);
            displayImage(featuresFilename, 'features', featuresContainer, featuresInfo);
            displayImage(depthFilename, 'depth', depthContainer, depthInfo);
            displayImage(lidarFilename, 'lidar', lidarContainer, lidarInfo);
        }

        // Put the buttons into their pre-Fetch state (Run/Clear down, Fetch up).
        // Called directly rather than on 'load': when a collapsed Grafana row is
        // re-expanded the script re-runs but the load event does not fire again.
        updateButtons();

    })(); // End of IIFE
    </script>
