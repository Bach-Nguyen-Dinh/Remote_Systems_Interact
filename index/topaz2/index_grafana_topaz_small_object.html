<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Object Detection Interface</title>
    <style>
        /* ------------------------------------------------------------------
           Grafana dark theme, matched to the rest of the Topaz dashboard
           (combined_dashboard.html / system_monitor.html / orientation.html):
           same tokens, same 13px Inter stack, same 3px radius. Declared in this
           page's own <style> rather than inherited from the shell, so the page
           still looks right opened directly at :5001/small_obj_app.
           ------------------------------------------------------------------ */
        :root {
            --bg:            #020406;
            --panel-bg:      #181b1f;
            --border:        #28292f;
            --input-border:  #2c3235;
            --text:          rgba(204, 204, 220, 0.90);
            --text-weak:     rgba(204, 204, 220, 0.65);
            --text-faint:    rgba(204, 204, 220, 0.40);
            --blue:          #2372cc;
            --blue-hover:    #3696ff;
            --green:         #73bf69;
            --red:           #f2495c;
            --track:         #2c3036;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        .sod-widget-body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            padding: 10px 12px 16px;
        }

        /* Captions above each image read as panel titles, so they use the same
           size/weight/colour as system_monitor.html's .panel-title. */
        .sod-widget-body h3,
        .sod-widget-body h4 {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-weak);
        }
        .sod-widget-body p { margin: 6px 0; }
        .sod-widget-body strong { font-weight: 500; color: var(--text-weak); }

        .sod-widget-button-container button {
            background-color: var(--blue);
            color: #fff;
            border: none;
            height: 32px;
            padding: 0 16px;
            margin: 0 4px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: background-color .15s ease;
        }

        .sod-widget-button-container button:hover:not(:disabled) {
            background-color: var(--blue-hover);
        }

        .sod-widget-button-container button:disabled {
            background-color: #6b7a8f;
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Combined Stop/Clear button - red, matching the HPC SAR Reset/Stop button
           (.buttonRed-sar in index/hpc/sar_process_reset.html). */
        .sod-widget-button-container button.sod-widget-button-red {
            background-color: #ca2715;
        }

        .sod-widget-button-container button.sod-widget-button-red:hover:not(:disabled) {
            background-color: #ff4c47;
        }

        /* Status line: green only for the 'ready' type updateStatus() passes,
           red for everything else, on the dashboard's own palette. */
        .sod-widget-status-bar {
            background-color: transparent;
            padding: 6px 10px;
            border-radius: 3px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--red);
        }
        .sod-widget-status-bar.ready { color: var(--green); }

        .sod-widget-image-display {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .sod-widget-image-panel {
            flex: 1;
            /* Flex items default to min-width:auto, which would let a wide image
               push the panel past the Grafana panel's width instead of shrinking. */
            min-width: 0;
            text-align: center;
        }
        
        .sod-widget-image-container {
            border: 1px solid var(--border);
            border-radius: 3px;
            /* padding: 10px; */
            background-color: var(--panel-bg);
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sod-widget-image-container img {
            /* Fill the container rather than a fixed pixel width, so appending an
               image never grows the panel past its Grafana-allotted width. */
            width: 100%;
            max-width: 100%;
            height: 500px;
            max-height: 500px;
            object-fit: cover;
            border-radius: 3px;
        }
        
        .sod-widget-image-placeholder {
            color: var(--text-faint);
            font-style: italic;
            font-size: 12px;
        }
        .sod-widget-control-panel {
            display: flex;
        }
        
        .sod-widget-button-container {
            flex: 1;
            /* margin-bottom: 20px; */
            text-align: center;
        }
        
        .sod-widget-progress-info {
            flex: 1;
            background-color: transparent;
            /* padding: 15px; */
            border-radius: 3px;
            /* margin-top: 20px; */
        }

        .sod-widget-container {
            /* max-width: 1200px; */
            margin: 0 auto;
            border-radius: 3px;
        }
    </style>
</head>
<body class="sod-widget-body">
    <div class="sod-widget-container">
        
        <div class="sod-widget-image-display">
            <div class="sod-widget-image-panel">
                <h3>Input image</h3>
                <div class="sod-widget-image-container">
                    <div id="inputImageContainer" class="sod-widget-image-placeholder">
                        No data
                    </div>
                </div>
                <p id="inputImageInfo"></p>
            </div>
            
            <div class="sod-widget-image-panel">
                <h3>Output image</h3>
                <div class="sod-widget-image-container">
                    <div id="outputImageContainer" class="sod-widget-image-placeholder">
                        No data
                    </div>
                </div>
                <p id="outputImageInfo"></p>
            </div>
        </div>

        <div class="sod-widget-control-panel">
            <div class="sod-widget-button-container">
                <button id="fetchBtn" onclick="preloadImages()">Fetch</button>
                <!-- Run/Clear start disabled: there is nothing to run or clear until
                     Fetch has cached the input data. updateButtons() owns them from
                     then on; the attribute here just avoids a flash of enabled
                     buttons before the script runs. -->
                <button id="runBtn" onclick="run_small_obj_detect()" disabled>Run</button>
                <!-- Doubles as Stop while a run is in flight (see updateButtons) -->
                <button id="clearBtn" class="sod-widget-button-red" onclick="clear_or_stop_small_obj_detect()" disabled>Clear</button>

                <div id="statusBar" class="sod-widget-status-bar">Click "Fetch" to provide data to AI</div>
                <p><strong>Processing Time:</strong> <span id="processingTime">-</span></p>
            </div>
        
            <!-- <div class="sod-widget-progress-info">
                <h4>Processing Information</h4>
                <p><strong>Current Status:</strong> <span id="processStatus">Idle</span></p>
                <p><strong>Latest Output:</strong> <span id="latestOutput">None</span></p>
            </div> -->
        </div>

    </div>

    <script>
        let sodInputImageCache = {};
        let sodOutputImageCache = {};
        
    (function() {
        'use strict';
        // All backend URLs below are RELATIVE (no leading slash, no host:port) so
        // they resolve against whatever origin/prefix this page was served from --
        // either http://<box>:5001/ or behind the nginx /topaz/ prefix. See
        // set_up_proxy_server.md and combined_dashboard.html.
        
        // let imageCache = {};
        let sodInputImageCache = {};
        let sodOutputImageCache = {};
        
        let isRunning = false;
        let startTime = null;
        // Open EventSource on 'small_obj_detect/events' while a run is in flight.
        // The host pushes each progress update once, so every frame the target
        // reports is displayed exactly once -- unlike polling 'progress', which
        // samples a last-value cache and so both misses and repeats updates.
        let progressStream = null;

        // Per-frame logging is itself a cost once DevTools is open -- three calls
        // per update, one of them serialising an object, at the rate the target
        // reports. Off by default; set sodVerboseLog = true in the console to get
        // the old running commentary back.
        let sodVerboseLog = false;

        // Frame-rate diagnostics. In debug_logs/console-export-2026-8-5_11-16-19.txt
        // all 712 updates arrived, in order, with no cache misses -- and the run
        // still looked like a few fps. Nothing is being lost, so the cause is
        // timing, and there are only two candidates:
        //   * the updates reach us in clumps -> gaps are mostly ~0 with periodic
        //     stalls, and each clump paints once, so most frames are never seen;
        //   * they arrive evenly but we cannot paint them -> gaps are even and
        //     'painted' comes out far below 'events'.
        // Arrival gaps answer the first, the paint counter answers the second.
        let sodDiag = null;

        function sodDiagStart() {
            sodDiag = { gaps: [], last: 0, events: 0, handlerMs: 0, paints: 0,
                        t0: performance.now() };
            // rAF fires once per composited frame, so this counts what the
            // browser actually put on screen, not how often we touched the DOM.
            const countPaint = () => {
                if (!sodDiag) return;
                sodDiag.paints++;
                requestAnimationFrame(countPaint);
            };
            requestAnimationFrame(countPaint);
        }

        function sodDiagReport() {
            if (!sodDiag || !sodDiag.events) { sodDiag = null; return; }
            const g = sodDiag.gaps.slice().sort((a, b) => a - b);
            const at = (p) => g.length ? g[Math.min(g.length - 1, Math.floor(p * g.length))].toFixed(1) : 'n/a';
            const secs = (performance.now() - sodDiag.t0) / 1000;
            console.log(
                `[diag] ${sodDiag.events} events in ${secs.toFixed(1)}s = ${(sodDiag.events / secs).toFixed(1)}/s\n` +
                `[diag] gap between events (ms): p50=${at(0.5)} p90=${at(0.9)} max=${g.length ? g[g.length - 1].toFixed(1) : 'n/a'}\n` +
                `[diag] back-to-back (<5ms after previous): ${g.filter(x => x < 5).length} of ${g.length}\n` +
                `[diag] stalls (>200ms with nothing): ${g.filter(x => x > 200).length}\n` +
                `[diag] handler cost: ${sodDiag.handlerMs.toFixed(0)}ms total, ${(sodDiag.handlerMs / sodDiag.events).toFixed(2)}ms per event\n` +
                `[diag] frames actually painted: ${sodDiag.paints} (${(sodDiag.paints / secs).toFixed(1)}/s)`
            );
            sodDiag = null;
        }

        // Fetch is a one-shot per page load: it caches the input/output frames in
        // memory (sodInputImageCache/sodOutputImageCache) and everything else works
        // off that cache, so re-fetching would only re-download what we already
        // hold. Run/Clear stay disabled until it has succeeded; Fetch retires once
        // it has. Deliberately NOT persisted to localStorage — a reload empties the
        // caches, so the new page must be allowed to fetch again.
        let hasFetched = false;
        let isFetching = false;
        
        // // Preload all images when page loads
        // window.addEventListener('load', function() {
        //     preloadImages();
        // });

        function clearImages() {
            document.getElementById('inputImageContainer').innerHTML = '<div class="sod-widget-image-placeholder">No data</div>';
            document.getElementById('outputImageContainer').innerHTML = '<div class="sod-widget-image-placeholder">No data</div>';
            document.getElementById('inputImageInfo').textContent = '';
            document.getElementById('outputImageInfo').textContent = '';
        }

        function updateStatus(message, type = '') {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = message;
            statusBar.className = `sod-widget-status-bar ${type}`;
        }

        function updateButtons() {
            const fetchBtn = document.getElementById('fetchBtn');
            const runBtn = document.getElementById('runBtn');
            const clearBtn = document.getElementById('clearBtn');

            // Retired for the rest of the page's life once it has succeeded, and
            // held down while it is in flight so a double-click can't start a
            // second preload over the top of the first.
            fetchBtn.disabled = isFetching || hasFetched;
            runBtn.disabled = isRunning || !hasFetched;
            runBtn.textContent = isRunning ? 'Processing...' : 'Run';
            clearBtn.disabled = !hasFetched;
            // One button, two jobs — same pattern as the HPC SAR panel's
            // Reset/Stop: "Stop" aborts the run on the Topaz box, "Clear" wipes
            // the results once nothing is running.
            clearBtn.textContent = isRunning ? 'Stop' : 'Clear';
        }

        function updateProcessingTime() {
            if (startTime) {
                const elapsed = Math.floor((new Date() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('processingTime').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }
        
        window.preloadImages = async function() {
            if (isFetching || hasFetched) return;
            isFetching = true;
            updateButtons();

            try {
                console.log('Starting enhanced image load...');
                updateStatus('Loading data list...', 'running');
                
                const response = await fetch(`small_obj_detect/image_list`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch image list: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Image list received:', data);
                
                const totalImages = data.input_images.length + data.output_images.length;
                // One percentage over the whole download. Repaint only when the
                // whole number changes.
                let loadedCount = 0;
                let lastPercent = -1;
                function reportProgress(percent) {
                    percent = Math.round(percent);
                    if (percent === lastPercent) return;
                    lastPercent = percent;
                    updateStatus(`Loading input data ... ${percent}%`, 'running');
                }
                function noteLoaded() {
                    // Clamped: if a chunk is retried, or the per-frame fallback
                    // takes over after some frames already arrived, late callbacks
                    // must not push the percentage past 100.
                    if (loadedCount < totalImages) loadedCount++;
                    reportProgress((loadedCount / totalImages) * 100);
                }

                reportProgress(0);

                // Enhanced image loading with retry mechanism
                function loadImageWithRetry(src, filename, imageType, maxRetries = 3, timeout = 15000) {
                    return new Promise((resolve, reject) => {
                        let attempts = 0;
                        
                        function attemptLoad() {
                            attempts++;
                            console.log(`Attempting to load ${filename} (${imageType}) (attempt ${attempts}/${maxRetries})`);                            
                            const img = new Image();
                            let timeoutId;
                            
                            img.onload = () => {
                                clearTimeout(timeoutId);
                                console.log(`✓ Loaded: ${filename} (${imageType})`);
                                
                                // Validate that the image actually loaded with content
                                if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                                    // Store in appropriate cache
                                    if (imageType === 'input') {
                                        sodInputImageCache[filename] = img;
                                    } else {
                                        sodOutputImageCache[filename] = img;
                                    }
                                    resolve({ success: true, filename, imageType, attempts });
                                } else {
                                    console.warn(`⚠ Image loaded but has no dimensions: ${filename} (${imageType})`);
                                    if (attempts < maxRetries) {
                                        setTimeout(attemptLoad, 1000 * attempts);
                                    } else {
                                        reject(new Error(`Image has no dimensions after ${maxRetries} attempts: ${filename} (${imageType})`));
                                    }
                                }
                            };
                            
                            img.onerror = () => {
                                clearTimeout(timeoutId);
                                console.error(`✗ Failed to load: ${filename} (${imageType}) (attempt ${attempts})`);
                                
                                if (attempts < maxRetries) {
                                    setTimeout(attemptLoad, 1000 * attempts);
                                } else {
                                    reject(new Error(`Failed to load after ${maxRetries} attempts: ${filename} (${imageType})`));
                                }
                            };
                            
                            // Set timeout for this attempt
                            timeoutId = setTimeout(() => {
                                console.warn(`⚠ Timeout loading: ${filename} (${imageType}) (attempt ${attempts})`);                                img.src = ''; // Cancel the request
                                
                                if (attempts < maxRetries) {
                                    setTimeout(attemptLoad, 1000 * attempts); // Progressive delay
                                } else {
                                    reject(new Error(`Timeout after ${maxRetries} attempts: ${filename} (${imageType})`));
                                }
                            }, timeout);
                            
                            img.src = src;
                        }
                        
                        attemptLoad();
                    });
                }
                
                // ---- bundled preload ----
                // Frames used to be fetched one at a time, each preceded by a
                // validate_image probe, so a set cost two round trips per frame
                // *in series*. That is invisible on the LAN but a round trip to
                // this server measures ~1 s from the other side of the world, so
                // the big sets took tens of minutes to transfer a few megabytes.
                // Ask for a few hundred frames per request instead and cut the
                // response up here. The probe is gone with it: /image_list only
                // ever lists frames the server already stat'd as readable.
                // Chunks are paced, and the whole page shares one concurrency
                // budget. This is what keeps the 1 s /system_metrics poll alive
                // during a Fetch: every response on this origin shares a single
                // HTTP/2 connection, so whatever frame data is already queued sits
                // in front of that poll and delays it by however long the link needs
                // to drain it.
                //
                // The budget is a TIME, not a byte count, because the link is not a
                // fixed speed: the same page measured 105 KB/s from Oregon in one
                // session and 6 KB/s in the next. 192 KB is a second of pipe on the
                // first and half a minute on the second, which is how a fixed chunk
                // size still let metrics polls stall 44 s. Size each chunk from the
                // speed the previous ones actually achieved instead, so the bytes in
                // flight stay near BUNDLE_TARGET_SECONDS x BUNDLE_PARALLEL of pipe
                // time whatever the link is doing that day.
                const BUNDLE_TARGET_SECONDS = 1.2;        // pipe time per request
                const BUNDLE_MIN_BYTES = 8 * 1024;        // sanity floor, not a target
                const BUNDLE_MAX_BYTES = 512 * 1024;      // must not devolve to per-frame
                const BUNDLE_PARALLEL = 2;                // requests in flight, page-wide
                const BUNDLE_MAX_FILES = 500;             // server's own per-request cap
                const BUNDLE_RETRIES = 3;                 // attempts per chunk

                // Speed is measured as plain goodput: bytes landed over wall clock.
                // Deliberately NOT by timing one response body -- anything that
                // buffers a small response and releases it in one burst (a proxy, a
                // TLS record boundary) makes a single-body measurement read as
                // instantaneous and the estimate runs away. Wall clock cannot be
                // fooled that way, and because it charges the round trips to the
                // link as well it only ever errs low, which costs a round trip
                // rather than a stall.
                //
                // Settling point, with a round trip R and a link speed L: a chunk
                // takes R + B/L, PARALLEL of them are in flight, so the measured
                // rate is P*B/(R + B/L) and B = TARGET * that rate. For P = 2 and
                // TARGET = 1.2 that solves to B = 1.4*L -- about 1.4 s of pipe per
                // chunk and under 3 s in flight, whatever L turns out to be.
                let bundleWindowAt = 0;                   // start of current window
                let bundleWindowBytes = 0;
                let bundleRate = 0;                       // bytes/sec, 0 until measured

                function chunkBudget() {
                    const elapsed = bundleWindowAt ? (performance.now() - bundleWindowAt) / 1000 : 0;
                    // A window is worth believing once it spans a round trip and a
                    // chunk. Roll it afterwards so the estimate follows the link's
                    // current speed instead of averaging in the slow ramp at the
                    // start.
                    if (elapsed >= 2 && bundleWindowBytes >= BUNDLE_MIN_BYTES) {
                        bundleRate = bundleWindowBytes / elapsed;
                        bundleWindowAt = performance.now();
                        bundleWindowBytes = 0;
                    }
                    if (!bundleRate) return BUNDLE_MIN_BYTES;
                    return Math.max(BUNDLE_MIN_BYTES,
                                    Math.min(BUNDLE_MAX_BYTES,
                                             Math.round(bundleRate * BUNDLE_TARGET_SECONDS)));
                }

                // A dropped connection is routine on a long-haul link. Retrying the
                // one chunk that failed costs a couple of hundred KB; letting the
                // error escape drops the whole page onto the per-frame fallback and
                // its ~1500 round trips, which is the slow path we came here to
                // remove.
                async function fetchChunk(url) {
                    if (!bundleWindowAt) bundleWindowAt = performance.now();
                    let lastError;
                    for (let attempt = 1; attempt <= BUNDLE_RETRIES; attempt++) {
                        try {
                            const response = await fetch(url);
                            if (!response.ok) {
                                throw new Error(`Bundle request failed: ${response.status}`);
                            }
                            const buffer = await response.arrayBuffer();
                            bundleWindowBytes += buffer.byteLength;
                            return buffer;
                        } catch (error) {
                            lastError = error;
                            console.warn(`Bundle chunk attempt ${attempt}/${BUNDLE_RETRIES} failed:`, error);
                            if (attempt < BUNDLE_RETRIES) {
                                await new Promise(resolve => setTimeout(resolve, 500 * attempt));
                            }
                        }
                    }
                    throw lastError;
                }

                // Take as many frames as the budget allows right now. Chunks are cut
                // at dequeue time rather than planned upfront so each one uses the
                // newest speed estimate. Sizes come from /image_list, which already
                // reports them per frame.
                function nextChunk(stream) {
                    if (stream.cursor >= stream.infos.length) return null;
                    const budget = chunkBudget();
                    const start = stream.cursor;
                    let bytes = 0;
                    let count = 0;
                    while (start + count < stream.infos.length && count < BUNDLE_MAX_FILES) {
                        const size = stream.infos[start + count].size || 0;
                        // A frame larger than the whole budget still gets a chunk of
                        // its own rather than stalling the queue.
                        if (count > 0 && bytes + size > budget) break;
                        bytes += size;
                        count++;
                    }
                    stream.cursor = start + count;
                    return { start: start, count: count };
                }

                // Cut one bundle body up into the cache. Resolves once every frame
                // in it has decoded, so Run can display any of them straight away.
                // Yields allSettled-shaped entries so the reporting below is
                // identical whichever path we took.
                function unpackBundle(buffer, imageType) {
                    const headerLength = new DataView(buffer).getUint32(0);
                    const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, 4, headerLength)));
                    const cache = imageType === 'input' ? sodInputImageCache : sodOutputImageCache;

                    let offset = 4 + headerLength;
                    return Promise.all(header.files.map(entry => {
                        const filename = entry.name;
                        const start = offset;
                        offset += entry.size;

                        // size 0 means the file vanished between the listing and
                        // the bundle; it contributes no bytes, so just skip it.
                        if (entry.size === 0) {
                            noteLoaded();
                            return Promise.resolve({ status: 'rejected', reason: new Error(`Missing on server: ${filename} (${imageType})`) });
                        }

                        const blob = new Blob([new Uint8Array(buffer, start, entry.size)], { type: 'image/webp' });
                        const url = URL.createObjectURL(blob);
                        return new Promise(resolve => {
                            const img = new Image();
                            img.onload = () => {
                                cache[filename] = img;
                                noteLoaded();
                                resolve({ status: 'fulfilled', value: { filename, imageType, attempts: 1 } });
                            };
                            img.onerror = () => {
                                URL.revokeObjectURL(url);
                                noteLoaded();
                                resolve({ status: 'rejected', reason: new Error(`Corrupt frame: ${filename} (${imageType})`) });
                            };
                            img.src = url;
                        });
                    }));
                }

                // Every set on the page feeds ONE queue drained by BUNDLE_PARALLEL
                // workers. Giving each set its own budget is what let six requests
                // go out together and buried the metrics poll.
                async function loadInBundles(sets) {
                    const streams = sets.map(set => ({
                        imageType: set.imageType, infos: set.infos, cursor: 0 }));
                    const results = [];
                    let at = 0;

                    async function worker() {
                        while (true) {
                            // Cutting the chunk is synchronous, so two workers can
                            // never be handed the same frames.
                            let stream = null;
                            let chunk = null;
                            while (at < streams.length) {
                                chunk = nextChunk(streams[at]);
                                if (chunk) { stream = streams[at]; break; }
                                at++;
                            }
                            if (!chunk) return;
                            const buffer = await fetchChunk(
                                `small_obj_detect/image_bundle/${stream.imageType}?start=${chunk.start}&count=${chunk.count}`);
                            results.push(await unpackBundle(buffer, stream.imageType));
                        }
                    }

                    const workers = [];
                    for (let i = 0; i < BUNDLE_PARALLEL; i++) {
                        workers.push(worker());
                    }
                    await Promise.all(workers);
                    return [].concat.apply([], results);
                }

                // Kept for a server that predates /image_bundle. Still one round
                // trip per frame, but they all go at once rather than in series.
                function loadOneByOne() {
                    const promises = [];
                    for (const filename of data.input_images) {
                        promises.push(loadImageWithRetry(`ai_smoke/images/input/${filename}`, filename, 'input'));
                    }
                    for (const filename of data.output_images) {
                        promises.push(loadImageWithRetry(`ai_smoke/images/output/${filename}`, filename, 'output'));
                    }
                    return Promise.allSettled(promises.map(promise =>
                        promise.then(result => { noteLoaded(); return result; },
                                     error => { noteLoaded(); throw error; })
                    ));
                }

                const validatedCount = totalImages;
                let results;
                try {

                    lastPercent = -1;
                    results = await loadOneByOne();
                }
                
                const successful = results.filter(r => r.status === 'fulfilled');
                const failed = results.filter(r => r.status === 'rejected');
                
                console.log(`Load completed: ${successful.length} successful, ${failed.length} failed`);
                
                // Log detailed failure information
                if (failed.length > 0) {
                    console.group('Failed image loads:');
                    failed.forEach((result, index) => {
                        console.error(`${index + 1}. ${result.reason.message}`);
                    });
                    console.groupEnd();
                }
                
                // Log successful loads with retry information
                if (successful.length > 0) {
                    console.group('Successful image loads:');
                    successful.forEach(result => {
                        const { filename, imageType, attempts } = result.value;
                        if (attempts > 1) {
                            console.log(`${filename} (${imageType}) (required ${attempts} attempts)`);
                        }
                    });
                    console.groupEnd();
                }
                
                const successRate = Math.round((successful.length / validatedCount) * 100);
                
                if (failed.length === 0) {
                    // updateStatus(`All input images loaded successfully (${successful.length}/${validatedCount})`, 'ready');

                    // updateStatus(`Images loaded: ${successful.length}/${validatedCount} (${successRate}%) - ${failed.length} failed`, 'ready');

                } else {

        window.run_small_obj_detect = function() {
            if (isRunning) return;
            
            isRunning = true;
            startTime = new Date();
            
            updateStatus('Starting small object detection...', 'running');
            updateButtons();
            
            // Clear previous images
            clearImages();
            
            try {
                fetch(`send_message`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: "run_small_obj_detect" })
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Command sent successfully:", data);
                    startProgressStream();
                })
                .catch(error => {
                    console.error("Error sending command:", error);
                    updateStatus('Error starting detection', 'error');
                    isRunning = false;
                    updateButtons();
                });
            } catch (error) {
                console.error("Error:", error);
                updateStatus('Error starting detection', 'error');
                isRunning = false;
                updateButtons();
            }
        }
        
        // The Clear button's click handler: it is labelled "Stop" while a run is
        // in flight, so route to whichever action the label promises.
        window.clear_or_stop_small_obj_detect = function() {
            if (isRunning) {
                stop_small_obj_detect();
            } else {
                clear_small_obj_detect();
            }
        }

        // Abort the run on the Topaz device. The host looks up the PID the target
        // reported when this run started and forwards
        // "stop_small_obj_detect:<pid>", so only this run's process is killed.
        // The displayed images are left alone — the button reverts to "Clear",
        // which is what wipes them.
        window.stop_small_obj_detect = function() {
            if (!isRunning) return;

            // Stop polling first: a progress update already in flight must not
            // flip the buttons back to the running state after we reset them.
            stopProgressStream();
            updateProcessingTime();   // freeze the elapsed time at the stop
            isRunning = false;
            startTime = null;
            updateStatus('Stopping detection...', 'running');
            updateButtons();

            fetch(`send_message`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: "stop_small_obj_detect" })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Stop command sent:", data);
                updateStatus('Detection stopped', 'ready');
            })
            .catch(error => {
                console.error("Error sending stop command:", error);
                updateStatus('Error stopping detection', 'error');
            });
        }

        window.clear_small_obj_detect = function() {
            stopProgressStream();
            isRunning = false;
            startTime = null;
            
            clearImages();
            updateStatus('Cleared', 'ready');
            updateButtons();
            
            // document.getElementById('processStatus').textContent = 'Idle';
            // document.getElementById('latestOutput').textContent = 'None';
            document.getElementById('processingTime').textContent = '-';
            
            // Send clear command to server
            fetch(`send_message`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: "clear_small_obj_detect" })
            })
            .catch(error => console.error("Error sending clear command:", error));
        }
        
        function startProgressStream() {
            stopProgressStream();

            // Relative URL, like every other call on this page, so it resolves
            // against whatever prefix the page was served from.
            progressStream = new EventSource(`small_obj_detect/events`);
            sodDiagStart();

            progressStream.onmessage = (event) => {
                // Taken before the handler runs, so the gap measures when the
                // event reached us and not how long we spent on the last one.
                const arrived = performance.now();
                try {
                    const data = JSON.parse(event.data);
                    if (data.type) {
                        handleProgressUpdate(data);
                    }
                } catch (error) {
                    console.error('Error handling progress event:', error);
                }
                if (sodDiag) {
                    if (sodDiag.last) sodDiag.gaps.push(arrived - sodDiag.last);
                    sodDiag.last = arrived;
                    sodDiag.events++;
                    sodDiag.handlerMs += performance.now() - arrived;
                }
            };

            // Fired on any transport drop. EventSource reconnects on its own and
            // the host replays the cached update on connect, so there is nothing
            // to do here but note it -- the run on the target is unaffected.
            progressStream.onerror = () => {
                if (progressStream && progressStream.readyState === EventSource.CONNECTING) {
                    console.warn('Progress stream dropped; reconnecting');
                }
            };
        }

        function stopProgressStream() {
            if (progressStream) {
                progressStream.close();
                progressStream = null;
            }
            // Every way a run ends -- complete, Stop, error -- comes through
            // here, so the summary is printed exactly once per run.
            sodDiagReport();
        }
        
        function handleProgressUpdate(data) {
            if (sodVerboseLog) console.log('Progress update:', data);
            
            switch (data.type) {
                case 'small_obj_detect_start':
                    updateStatus('Detection started', 'running');
                    // document.getElementById('processStatus').textContent = 'Running';
                    break;
                    
                case 'small_obj_detect_progress':
                    // Log what we're trying to display
                    // console.log(`Attempting1111 input=${data.input_image}, output=${data.output_image}`);
                    
                    // Check if images exist in cache before displaying
                    if (!sodInputImageCache[data.input_image]) {
                        console.warn(`Input data ${data.input_image} not found in input cache`);
                    }
                    if (!sodOutputImageCache[data.output_image]) {
                        console.warn(`Output data ${data.output_image} not found in output cache`);
                    }
                                        
                    displayImagePair(data.input_image, data.output_image);
                    // console.log(`Attempting2222 input=${data.input_image}, output=${data.output_image}`);
                    // document.getElementById('latestOutput').textContent = data.output_image;

                    updateProcessingTime();
                    // console.log(`Attempting3333 input=${data.input_image}, output=${data.output_image}`);

                    break;
                    
                case 'small_obj_detect_complete':
                    updateStatus('Detection completed', 'ready');
                    // document.getElementById('processStatus').textContent = 'Completed';
                    isRunning = false;
                    updateButtons();
                    stopProgressStream();
                    break;
                    
                case 'small_obj_detect_stopped':
                    // The target confirming a Stop. Normally the poller is
                    // already down by the time this lands (stop_small_obj_detect
                    // stops it), but handle it so a stop triggered from anywhere
                    // else still settles the UI.
                    updateStatus('Detection stopped', 'ready');
                    isRunning = false;
                    updateButtons();
                    stopProgressStream();
                    break;

                case 'small_obj_detect_error':
                    updateStatus(`Error: ${data.error}`, 'error');
                    // document.getElementById('processStatus').textContent = 'Error';
                    isRunning = false;
                    updateButtons();
                    stopProgressStream();
                    break;
            }
        }
        
        function displayImagePair(inputFilename, outputFilename) {
            if (sodVerboseLog) console.log(`Displaying images: input=${inputFilename}, output=${outputFilename}`);
            const inputContainer = document.getElementById('inputImageContainer');
            const outputContainer = document.getElementById('outputImageContainer');
            const inputInfo = document.getElementById('inputImageInfo');
            const outputInfo = document.getElementById('outputImageInfo');
            
            // Function to create and display image with fallback
            function displayImage(filename, type, container, infoElement) {
                let cachedImg;
                
                // Get image from appropriate cache
                if (type === 'input') {
                    cachedImg = sodInputImageCache[filename];
                } else {
                    cachedImg = sodOutputImageCache[filename];
                }
                
                if (cachedImg && cachedImg.complete && cachedImg.naturalWidth > 0) {
                    // Create a new image element to display
                    const displayImg = document.createElement('img');
                    displayImg.src = cachedImg.src;
                    // displayImg.style.maxWidth = '100%';
                    // displayImg.style.maxHeight = '400px';
                    // displayImg.style.borderRadius = '4px';
                    
                    container.innerHTML = '';
                    container.appendChild(displayImg);
                    // infoElement.textContent = `${type.charAt(0).toUpperCase() + type.slice(1)}: ${filename}`;
                    infoElement.textContent = ``;
                    
                    // Add error handling for display
                    displayImg.onerror = () => {
                        console.error(`Failed to display ${type} image: ${filename}`);
                        container.innerHTML = `<div class="sod-widget-image-placeholder">Failed to display ${type} image</div>`;
                    };
                    
                    return true;
                } else {
                    console.warn(`${type} image not available in cache: ${filename}`);
                    container.innerHTML = `<div class="sod-widget-image-placeholder">${type.charAt(0).toUpperCase() + type.slice(1)} image not available</div>`;
                    return false;
                }
            }
            
            // Display both images
            const inputDisplayed = displayImage(inputFilename, 'input', inputContainer, inputInfo);
            const outputDisplayed = displayImage(outputFilename, 'output', outputContainer, outputInfo);
            
            // Log display status
            if (inputDisplayed && outputDisplayed) {
                if (sodVerboseLog) console.log(`Successfully displayed both images: ${inputFilename} and ${outputFilename}`);
            } else {
                console.warn(`Partial display: input=${inputDisplayed}, output=${outputDisplayed}`);
            }
        }

        // Put the buttons into their pre-Fetch state (Run/Clear down, Fetch up).
        updateButtons();

    })(); // End of IIFE
