<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight One</title>
    <style>
        /* ------------------------------------------------------------------
           Combined HPC frontend, served by combined_hpc.py at '/test'. It is only
           a thin shell: collapsible sections, each hosting one of the
           existing standalone pages in a same-origin <iframe>:
             * SAR application        -> /sar_app        (sar_process_upload.html)
             * Vision language model  -> /vlm/
             * Live system utilisation-> /system_monitor (system_monitor.html)
             * Performance analysis   -> /performance_analysis
                                                       (performance_analysis.html)
             * Edge device            -> /topaz/         (the Topaz shell)

           Those sections are split across two tabs selected from the branding
           header: "Server" (everything running on this box) and "Edge device"
           (the Topaz shell), with Server as the default. The Topaz frame is a
           whole nested dashboard, so it is only loaded the first time its tab is
           opened — and then stays mounted, since it polls and would restart from
           scratch on every switch.
           Two of those sections stream from OTHER boxes and reach us only via
           nginx: the VLM app (/vlm/) and the Topaz edge device (/topaz/). When
           one of those boxes is off its frame would show nginx's raw 502 page,
           so both are health-gated -- see "device health" in the script below.

           Keeping them as iframes means each page stays standalone and is edited
           independently; nothing here touches their CSS/JS. Because both frames
           are same-origin, the monitor frame is auto-sized to its content so the
           whole dashboard scrolls as one page (no nested scrollbar). The SAR page
           is a fixed-height (fill-the-box) design, so its frame keeps a set height.
           The Grafana dark theme is reproduced here so the shell matches the
           frames it hosts.
           ------------------------------------------------------------------ */
        :root {
            --bg:        #020406;
            --border:    #28292f;
            --text:      rgba(204, 204, 220, 0.90);
            --text-weak: rgba(204, 204, 220, 0.65);
            --blue:      #3696ff;
            --warn:      #f2cc0c;
            --panel:     #111217;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            padding: 8px 10px 24px;
        }

        /* ---- collapsible section (Grafana row-header style) ---- */
        .section-row { margin-bottom: 6px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding: 6px 4px;
            color: var(--text-weak);
            font-size: 15px;
            font-weight: 400;
        }
        .section-header:hover { color: var(--text); }
        .section-header .chev {
            display: inline-block;
            font-size: 11px;
            transition: transform 0.15s ease;
        }
        .section-row.collapsed .chev { transform: rotate(-90deg); }
        .section-row.collapsed .section-body { display: none; }

        .frame {
            width: 100%;
            border: none;
            display: block;
            background: var(--bg);
        }

        /* ---- AICRAFT branding header ----------------------------------------
           ------------------------------------------------------------------ */
        .brand-header {
            display: flex;
            align-items: stretch;
            /* gap: 12px; */
            height: 95px;
            /* padding: 6px 4px 10px; */
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .brand-header .bframe { width: 100%; border: none; display: block; background: transparent; }
        /* Sized by the source image's own ratio (285x153) rather than a fixed
           width, so it fills the header height without letterboxing. */
        .brand-header .brand-rsat { flex: 0 0 190px; width: auto; height: 100%; aspect-ratio: 285 / 153; min-width: 0; 
            /* padding-right: 12px;  */
        }
        /* min-width: 0 is required on every iframe here: as replaced elements
           they get an automatic minimum size of their 300px intrinsic width in
           Chrome/Edge, which overrides any smaller flex-basis. */
        .brand-insight { flex: 0 0 250px; min-width: 0; min-height: 0; padding-left: 16px; padding-right: 16px; padding-top: 4px; }
        .brand-mission { flex: 0 1 800px; aspect-ratio: 1270 / 148; min-width: 0; }
        /* Dropped by the script below once the row can no longer spare 300px
           for it; the tagline is unreadable squeezed narrower than that. */
        .brand-mission.brand-hidden { display: none; }
        .brand-aicraft { flex: 0 0 150px; min-width: 0; min-height: 0; padding-bottom: 3px; padding-left: 16px; }
        .brand-divider { flex: 0 0 1px; background: var(--border); align-self: center; height: 40px; }
        .brand-spacer { flex: 1 1 auto; }

        /* ---- Server / Edge device tabs, right end of the branding row ----
           Pulled down 1px so the active tab's underline lands on the header's
           own bottom border rather than floating above it. */
        .brand-tabs {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            margin-bottom: -1px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-weak);
            padding: 10px 18px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ---- disconnected-device placeholder ----------------------------
           Stands in for a health-gated frame while its box is unreachable.
           .frame[hidden] needs the explicit rule because the `hidden`
           attribute is a UA-stylesheet declaration and loses to .frame's own
           display:block; the attribute selector outranks it. */
        .frame[hidden] { display: none; }

        .device-offline {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            /* Keeps the section the size of a panel rather than letting it
               collapse to nothing, so the page does not jump when a device
               drops out and comes back. */
            min-height: 220px;
            padding: 32px 20px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--panel);
            text-align: center;
        }
        .device-offline.show { display: flex; }
        .device-offline .dev-icon { font-size: 26px; line-height: 1; color: var(--text-weak); }
        .device-offline.is-down .dev-icon { color: var(--warn); }
        .device-offline .dev-title { font-size: 15px; color: var(--text); }
        /* pre-line: the detail is two sentences joined by a newline in
           paintPlaceholder -- the verdict, then what happens next -- and each
           gets its own line. Still wraps within max-width like normal text. */
        .device-offline .dev-detail {
            font-size: 12px;
            color: var(--text-weak);
            max-width: 460px;
            white-space: pre-line;
        }
        .device-offline .dev-retry {
            margin-top: 4px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text-weak);
            font-family: inherit;
            font-size: 12px;
            padding: 6px 14px;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }
        .device-offline .dev-retry:hover { color: var(--text); border-color: var(--text-weak); }
    </style>
</head>
<body>

    <!-- ===================== AICRAFT branding header ===================== -->
    <div class="brand-header">
        <iframe class="bframe brand-rsat"     src="/branding/rsat_logo_panel.html"
                title="RSAT" scrolling="no"></iframe>
        <!-- <div class="brand-divider"></div> -->
        <!-- <div class="brand-spacer"></div> -->
        <iframe class="bframe brand-mission" src="/branding/rsat_mission_panel.html"
                title="Trusted satellite systems for high data missions" scrolling="no"></iframe>
        <div class="brand-divider"></div>
        <iframe class="bframe brand-insight"  src="/branding/insight_one_logo_panel.html"
                title="Insight One" scrolling="no"></iframe>
        <div class="brand-divider"></div>
        <iframe class="bframe brand-aicraft" src="/branding/ai_craft_logo_panel.html"
                title="Powered by AICRAFT" scrolling="no"></iframe>
        <div class="brand-spacer"></div>
        <div class="brand-tabs">
            <button class="tab-btn active" data-tab="server" onclick="switchTab('server')">Server</button>
            <button class="tab-btn" data-tab="edge" onclick="switchTab('edge')">Edge Device</button>
        </div>
    </div>

    <!-- ===================== Server tab ===================== -->
    <div class="tab-panel active" data-tab="server">

    <!-- ===================== SAR application ===================== -->
    <div class="section-row" id="sec-sar">
        <div class="section-header" onclick="toggleSection('sec-sar')">
            <span class="chev">&#9662;</span><span>Synthetic aperture radar</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-sar" src="/sar_app"
                    title="Synthetic aperture radar" style="height: 720px;"></iframe>
        </div>
    </div>

    <!-- ===================== Performance analysis ===================== -->
    <!-- Starts collapsed: it is a post-run view, so there is nothing to look at
         until a SAR run has finished. -->
    <div class="section-row collapsed" id="sec-perf">
        <div class="section-header" onclick="toggleSection('sec-perf')">
            <span class="chev">&#9662;</span><span>Performance analysis</span>
        </div>
        <div class="section-body">
            <!-- A plain src, loaded with the page even though the row starts
                 collapsed. Deferring it would need a mount step, and the only
                 one here is the /device_health gate, which exists for the two
                 REMOTE boxes that can be unreachable -- this panel is served by
                 our own backend, so gating it would be inventing a failure mode
                 it does not have. The panel is cheap (one small JSON poll, plus
                 six ~10-40 KB plots that only refetch when the run changes), and
                 it re-polls itself when the row is opened.
                 scrolling="no": auto-sized to its own content (see FRAMES
                 below), so it is never meant to scroll on its own. -->
            <iframe class="frame" id="frame-perf" src="/performance_analysis"
                    scrolling="no" title="Performance analysis"
                    style="height: 1400px;"></iframe>
        </div>
    </div>

    <!-- ===================== VLM application ===================== -->
    <div class="section-row" id="sec-vlm">
        <div class="section-header" onclick="toggleSection('sec-vlm')">
            <span class="chev">&#9662;</span><span>Vision language model</span>
        </div>
        <div class="section-body">
            <!-- data-src, not src: health-gated, so the frame is only ever
                 pointed at /vlm/ once the VLM box is known to be answering.
                 Loading it unconditionally would paint nginx's 502 page here
                 whenever that box is down. -->
            <iframe class="frame" id="frame-vlm" data-src="/vlm/" hidden
                    title="Vision language model" style="height: 800px;"></iframe>
            <div class="device-offline show" id="off-vlm">
                <div class="dev-icon">&#9679;</div>
                <div class="dev-title">Connecting&hellip;</div>
                <div class="dev-detail"></div>
                <button class="dev-retry" type="button" onclick="checkDevices()">Check again</button>
            </div>
        </div>
    </div>

    <!-- ===================== CCTV application ===================== -->
    <!-- <div class="section-row" id="sec-cctv">
        <div class="section-header" onclick="toggleSection('sec-cctv')">
            <span class="chev">&#9662;</span><span>CCTV analysis</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-cctv" src="/cctv_app"
                    title="CCTV analysis" style="height: 720px;"></iframe>
        </div>
    </div> -->

    <!-- ===================== Live system utilisation ===================== -->
    <div class="section-row" id="sec-mon">
        <div class="section-header" onclick="toggleSection('sec-mon')">
            <span class="chev">&#9662;</span><span>Live system utilisation</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-mon" src="/system_monitor"
                    title="Live system utilisation" style="height: 600px;"></iframe>
        </div>
    </div>

    </div><!-- /Server tab -->

    <!-- ===================== Edge device tab ===================== -->
    <div class="tab-panel" data-tab="edge">

    <!-- ===================== Topaz box ===================== -->
    <div class="section-row" id="sec-topaz">
        <div class="section-body">
            <!-- data-src, not src: loaded on the first visit to this tab.
                 scrolling="no": this frame is auto-sized to the Topaz shell's own
                 content height, so it is never meant to scroll on its own -- the
                 page scrolls as one. Without this, any moment where the fitted
                 height trails the content (a tab switch, a workload growing the
                 page between polls) shows a second scrollbar beside the window's.
                 Only affects the framed instance; /topaz/ opened directly still
                 scrolls normally. Frames with a FIXED height (SAR, VLM) keep their
                 scrollbars -- those genuinely need them. -->
            <iframe class="frame" id="frame-topaz" data-src="/topaz/" scrolling="no" hidden
                    title="Edge Device" style="height: 1900px;"></iframe>
            <div class="device-offline show" id="off-topaz">
                <div class="dev-icon">&#9679;</div>
                <div class="dev-title">Connecting&hellip;</div>
                <div class="dev-detail"></div>
                <button class="dev-retry" type="button" onclick="checkDevices()">Check again</button>
            </div>
        </div>
    </div>

    </div><!-- /Edge device tab -->

    <script>
    (function () {
        "use strict";

        // Same-origin, auto-sized frames. The Topaz frame is also health-gated
        // (see "device health" below), so it is mounted by render() rather than
        // here; once mounted it stays in the DOM, and its nested dashboard keeps
        // polling instead of reloading on every tab switch.
        // The monitor builds its per-core grid a
        // second or so after load (first /system_metrics response); the Topaz
        // frame is itself a shell whose inner frames change height when its own
        // vision tab is switched — so both are re-fitted on a 1s poll as well as
        // on load/resize. Each entry: [element, fallback height, section id, tab].
        var FRAMES = [
            [document.getElementById("frame-mon"),   600,  "sec-mon",   "server"],
            [document.getElementById("frame-perf"),  1400, "sec-perf",  "server"],
            [document.getElementById("frame-topaz"), 1900, "sec-topaz", "edge"]
        ];

        function docOf(fr) {
            try { return fr.contentWindow.document; } catch (e) { return null; }
        }
        // Measure the BODY, not documentElement: an auto-height body is exactly as
        // tall as its content, while documentElement.scrollHeight is never smaller
        // than the frame's own viewport (i.e. the height we already set). Measuring
        // the body is what lets a frame SHRINK as well as grow — the Topaz frame is
        // a shell whose vision tabs differ by ~1000px, and a grow-only fit kept the
        // tallest tab's height forever, leaving a big empty gap under short tabs.
        function contentHeight(d) {
            if (!d) return 0;
            var b = d.body;
            if (b) {
                var h = Math.max(b.scrollHeight, Math.ceil(b.getBoundingClientRect().height));
                if (h) return h;
            }
            return d.documentElement ? d.documentElement.scrollHeight : 0;
        }
        // A frame in the inactive tab (or a collapsed section) measures as 0 and
        // would snap to its fallback, so skip it: it is fitted when its tab is
        // actually shown.
        function isVisible(fr) {
            return fr.offsetParent !== null;
        }
        // Size a frame to its content, in both directions. The deadband is
        // deliberately one-sided: leaving the frame even 1px SHORT than its
        // content makes the browser paint a scrollbar inside it -- e.g. the Topaz
        // shell is 2544px tall on the Small object tab and 2545px on AI ship, and
        // a symmetric 1px deadband swallowed that change, so the AI ship tab got a
        // second scrollbar next to the window's. Any shortfall is corrected
        // immediately; only shrinking is damped, which is all that is needed to
        // stop sub-pixel noise rewriting the style on every tick.
        function fit(fr, fallback) {
            var d = docOf(fr);
            if (!d || !isVisible(fr)) return;
            var h = contentHeight(d) || fallback;
            if (h > fr.offsetHeight || fr.offsetHeight - h > 1) fr.style.height = h + "px";
        }

        // Re-fit a frame a few times after a reveal/load: it needs a moment to
        // lay out, and the pages build async grids from their first data response.
        function refit(f) {
            [0, 150, 400, 1000, 1500].forEach(function (ms) {
                setTimeout(function () { fit(f[0], f[1]); }, ms);
            });
        }

        FRAMES.forEach(function (f) {
            f[0].addEventListener("load", function () { refit(f); });
        });
        setInterval(function () { FRAMES.forEach(function (f) { fit(f[0], f[1]); }); }, 1000);

        // A resize re-measures each frame from its FALLBACK height rather than
        // from the height it happens to be at. fit() alone is not enough here:
        // it can only report a height the framed page is willing to give while
        // sitting in a frame of the current size, and a page whose <body> is
        // full-height (height:100%, or any fill-the-box design) is by definition
        // exactly as tall as the frame it was handed -- so it grows and never
        // shrinks. That is what left the dashboard stuck tall after narrowing
        // the window and widening it again: the inner content had reflowed back
        // into fewer, shorter rows, but the frame kept the height it needed
        // while narrow and only a reload cleared it. Collapsing first puts the
        // frame below its content so the content dictates the height again.
        // Both writes happen in one synchronous task, so the intermediate
        // (short) height is measured but never painted -- no flicker.
        function remeasure() {
            // Collapsing shortens the page, and the forced layout inside fit()
            // clamps the window's scroll offset to the shorter document. Restore
            // it afterwards so resizing while scrolled down doesn't jump the page.
            var se = document.scrollingElement || document.documentElement;
            var top = se.scrollTop;
            FRAMES.forEach(function (f) {
                if (!docOf(f[0]) || !isVisible(f[0])) return;
                f[0].style.height = f[1] + "px";
                fit(f[0], f[1]);
            });
            if (se.scrollTop !== top) se.scrollTop = top;
        }

        var resizeTimer = null;
        window.addEventListener("resize", function () {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(remeasure, 200);
        });

        window.toggleSection = function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle("collapsed");
            // Re-fit a frame when its section is revealed (it can't be measured
            // while display:none), on the next frame so layout has settled.
            if (!el.classList.contains("collapsed")) {
                // A revealed section can now be measured -- and, if it holds a
                // health-gated frame that has been waiting for somewhere visible
                // to load into, mounted.
                DEVICES.forEach(function (d) { if (d.sec === id) render(d); });
                FRAMES.forEach(function (f) {
                    if (f[2] !== id) return;
                    refit(f);
                });
            }
        };

        // ---- Server / Edge device tabs ----
        window.switchTab = function (tab) {
            document.querySelectorAll(".tab-btn").forEach(function (b) {
                b.classList.toggle("active", b.dataset.tab === tab);
            });
            document.querySelectorAll(".tab-panel").forEach(function (p) {
                p.classList.toggle("active", p.dataset.tab === tab);
            });

            // Now that the panel is visible its frames can be mounted and measured.
            DEVICES.forEach(function (d) { if (d.tab === tab) render(d); });
            FRAMES.forEach(function (f) {
                if (f[3] !== tab) return;
                refit(f);
            });
        };

        // ================= device health =================================
        // The VLM and Topaz panels stream from separate boxes that the browser
        // only reaches through nginx, so when one is off its frame would fill
        // with nginx's 502 page. combined_hpc.py probes both from the box nginx
        // proxies from and publishes the verdict at /device_health; this polls
        // that and swaps each frame against a "disconnected" placeholder.
        //
        // Why this can recover a panel WITHOUT reloading the page: each panel is
        // its own browsing context, so pointing #frame-vlm at a new URL
        // re-navigates that frame and nothing else. A SAR run in #frame-sar, the
        // monitor, the profiler plots -- none of them observe it. The only thing
        // that would disturb them is reloading this shell, which nothing here
        // ever does.
        //
        // And the rule that makes the reload itself safe: a frame is only ever
        // mounted out of the placeholder state. A frame that is loaded and whose
        // device is up is never touched, however often the poll runs, so a
        // recovery cannot interrupt somebody mid-conversation in the VLM panel.
        // A frame showing the placeholder holds no state to lose, because the
        // box behind it was unreachable.
        var DEVICES = [
            { key: "vlm",   sec: "sec-vlm",   tab: "server",
              name: "Vision language model", src: "/vlm/",
              frame: document.getElementById("frame-vlm"),
              ph:    document.getElementById("off-vlm") },
            { key: "topaz", sec: "sec-topaz", tab: "edge",
              name: "Edge device", src: "/topaz/",
              frame: document.getElementById("frame-topaz"),
              ph:    document.getElementById("off-topaz") }
        ];
        DEVICES.forEach(function (d) {
            d.loaded = false;             // is the frame currently showing the real page?
            d.status = "unknown";         // last verdict from /device_health
            d.detail = "";
            d.body   = d.frame.parentNode;  // the .section-body wrapping both
        });

        var HEALTH_INTERVAL = 5000;
        var healthTimer = null;

        // The FRAMES entry for a device's frame, if it has one (Topaz is
        // auto-sized, the VLM frame has a fixed height), so a freshly mounted
        // frame gets the same post-load re-fit as one that loaded normally.
        function fitEntryFor(dev) {
            for (var i = 0; i < FRAMES.length; i++) {
                if (FRAMES[i][0] === dev.frame) return FRAMES[i];
            }
            return null;
        }

        // Is there anywhere on screen for this frame to load into? A collapsed
        // section and an inactive tab are both display:none, and a frame mounted
        // into one measures as 0 and cannot be fitted -- so mounting waits until
        // toggleSection/switchTab reveals it.
        function sectionVisible(dev) {
            return dev.body.offsetParent !== null;
        }

        function mount(dev) {
            dev.frame.src = dev.src;
            dev.loaded = true;
            dev.ph.classList.remove("show");
            dev.frame.removeAttribute("hidden");
            var f = fitEntryFor(dev);
            if (f) refit(f);
        }

        // Point the frame at about:blank rather than leaving the dead page up:
        // it stops that page's own pollers from hammering an upstream nginx can
        // no longer reach, and it guarantees the frame holds nothing when the
        // placeholder goes over it.
        function unmount(dev) {
            dev.loaded = false;
            dev.frame.setAttribute("hidden", "");
            dev.frame.src = "about:blank";
        }

        function paintPlaceholder(dev) {
            var down = dev.status === "down";
            dev.ph.classList.toggle("is-down", down);
            dev.ph.classList.add("show");
            dev.ph.querySelector(".dev-title").textContent = down
                ? dev.name + " is disconnected"
                : "Connecting to " + dev.name + "\u2026";
            dev.ph.querySelector(".dev-detail").textContent = down
                ? dev.detail + ".\nThis panel will reappear on its own once the device answers."
                : "";
        }

        function render(dev) {
            if (dev.status === "up") {
                // Already up and mounted: leave it strictly alone.
                if (dev.loaded) return;
                if (sectionVisible(dev)) mount(dev);
                else paintPlaceholder(dev);   // mounts when its tab/section opens
                return;
            }
            if (dev.loaded) unmount(dev);
            paintPlaceholder(dev);
        }

        // Give up on gating and just load both frames, as the shell did before
        // health checks existed. Used when the backend has no /device_health at
        // all -- an unreachable device is a much better outcome than two panels
        // stuck on "Connecting..." because the server is older than this page.
        function disableGate() {
            if (healthTimer) { clearInterval(healthTimer); healthTimer = null; }
            DEVICES.forEach(function (dev) {
                dev.status = "up";
                render(dev);
            });
        }

        // Poll the cached verdict. A failure here means OUR backend hiccuped,
        // which says nothing about the remote boxes, so the last verdict stands
        // rather than every panel dropping out at once.
        window.checkDevices = function () {
            fetch("/device_health", { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 404) { disableGate(); return null; }
                    return r.ok ? r.json() : null;
                })
                .then(function (j) {
                    if (!j || !j.devices) return;
                    DEVICES.forEach(function (dev) {
                        var d = j.devices[dev.key];
                        if (!d) return;
                        dev.status = d.status;
                        dev.detail = d.detail || "";
                        render(dev);
                    });
                })
                .catch(function () { /* keep the last verdict */ });
        };

        checkDevices();
        healthTimer = setInterval(checkDevices, HEALTH_INTERVAL);
        // Browsers throttle timers in a backgrounded tab to about one a minute,
        // so a device that recovered while you were elsewhere would take that
        // long to reappear. Re-check the moment the dashboard is looked at again.
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) checkDevices();
        });
    })();

    /* Drop the mission tagline from the branding row when the window is too
       narrow to give it a usable width. Every other item in the row has
       flex-shrink: 0, so the width left over for the mission panel can be
       measured without depending on whether it is currently shown -- which is
       what keeps this from oscillating once it has been hidden. */
    (function () {
        var header  = document.querySelector(".brand-header");
        var mission = document.querySelector(".brand-mission");
        if (!header || !mission) return;

        var MIN_WIDTH = 400;

        function apply() {
            var used = 0;
            Array.prototype.forEach.call(header.children, function (el) {
                // The spacer only soaks up slack, so it never claims width the
                // mission panel could have used.
                if (el === mission || el.classList.contains("brand-spacer")) return;
                used += el.offsetWidth;
            });
            var available = header.clientWidth - used;
            mission.classList.toggle("brand-hidden", available < MIN_WIDTH);
        }

        apply();
        window.addEventListener("resize", apply);
        if (window.ResizeObserver) new ResizeObserver(apply).observe(header);
        // The tab buttons are part of the measurement, so re-check once webfonts
        // have settled and their width is final.
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply);
    })();
    </script>
</body>
</html>
