<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR Process</title>
    <style>
        /* ------------------------------------------------------------------
           Standalone SAR-process frontend, served by combined_hpc.py and
           embedded in Grafana via an <iframe> in a Text panel. Because the
           iframe no longer inherits Grafana's stylesheet, the Grafana dark
           theme (colours, fonts, panel look) is reproduced here.
           ------------------------------------------------------------------ */
        :root {
            --bg:            #020406;   /* Grafana canvas background            */
            --panel-bg:      #111217;   /* image window background              */
            --border:        #28292f;   /* image window border                 */
            --input-border:  #2c3235;   /* form control border                 */
            --text:          rgba(204, 204, 220, 0.90);
            --text-weak:     rgba(204, 204, 220, 0.65);
            --heading:       rgba(204, 204, 220, 0.90);
            --blue:          #2372cc;
            --blue-hover:    #3696ff;
            --red:           #ca2715;
            --red-hover:     #ff4c47;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            flex-direction: row;
            height: 100%;
            box-sizing: border-box;
            padding: 12px;
            gap: 12px;
        }

        /* ---- Left sidebar: Input / Output / buttons ---- */
        .sidebar {
            /* width: 300px; */
            flex: 0 0 250px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 22px;
            font-weight: 400;
            color: var(--heading);
            margin: 0 0 12px 0;
        }

        .section + .section { margin-top: 22px; }

        .select-sar {
            font-size: 14px;
            width: 100%;
            max-width: 270px;
            height: 40px;
            box-sizing: border-box;
            padding: 0 8px;
            border-radius: 2px;
            border: 1px solid var(--input-border);
            background-color: #0e0f12;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .select-sar:focus { outline: none; border-color: var(--blue); }

        .status-container {
            font-size: 13px;
            min-height: 18px;
            margin: 12px 0;
            font-weight: bold;
            color: var(--red-hover);
        }
        .status-container p { margin: 0; }

        /* Label on the left, value on the right */
        .status-info p {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 9px 0;
            font-size: 13px;
        }
        .status-info strong { font-weight: 500; color: var(--text); }
        .status-info span   { color: var(--text-weak); text-align: right; }

        /* ---- Run / Reset buttons ---- */
        .buttons-row {
            display: flex;
            flex-direction: row;
            gap: 40px;
            margin-top: 34px;
            padding-left: 30px;
        }
        .buttonBlue-sar, .buttonRed-sar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 40px;
            border-radius: 2px;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .buttonBlue-sar { background-color: var(--blue); }
        .buttonBlue-sar:hover { background-color: var(--blue-hover); }
        /* Running state: still clickable (so a click can report "already
           running") but visually disabled. */
        .buttonBlue-sar.running,
        .buttonBlue-sar.running:hover {
            background-color: #6b7a8f;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .buttonRed-sar { background-color: var(--red); }
        .buttonRed-sar:hover { background-color: var(--red-hover); }
        /* Disabled state: input data not loaded yet, or the RUN command is still
           in flight — grayed out and unclickable. */
        .buttonBlue-sar.disabled,
        .buttonBlue-sar.disabled:hover,
        .buttonRed-sar.disabled,
        .buttonRed-sar.disabled:hover {
            background-color: #6b7a8f;
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ---- Right: the two SAR image windows ---- */
        .images-row {
            display: flex;
            flex-direction: row;
            gap: 12px;
            flex: 1;
            min-width: 0;
            height: 100%;
        }
        .sar-image-container {
            position: relative;
            flex: 1;
            min-width: 0;
            background-color: var(--panel-bg);
            border: 2px solid var(--border);
            overflow: hidden;
        }
        .sar-image-container img {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .no-data-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-weak);
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ================= Left sidebar ================= -->
        <div class="sidebar">
            <!-- Input -->
            <div class="section">
                <h2>Input</h2>
                <!-- Hover/focus no longer rebuild the list; it is fetched once on
                     page load and again on Reset (both go through resetMenu()):
                         onmouseenter="refresh_sar_input_list()"
                         onfocus="refresh_sar_input_list()"
                -->
                <select id="menu_sar_input_data" class="select-sar"
                        onmousedown="return sarGuardInteraction(event)"
                        onkeydown="return sarGuardInteraction(event)"
                        onchange="sendLoad()"
                        onblur="sarFlushPendingFileList()">
                    <option value="" disabled selected>Click to choose input data</option>
                </select>
                <div class="status-container"><p id="status">&nbsp;</p></div>
                <div class="status-info" style="margin-top: 30px;">
                    <p><strong>CPHD file size:</strong> <span id="cphd_file_size">N/A</span></p>
                    <p><strong>Pulses:</strong> <span id="total_pulses">N/A</span></p>
                    <p><strong>Frequency:</strong> <span id="centre_freq">N/A</span></p>
                    <p><strong>Image size:</strong> <span id="img_size">N/A</span></p>
                    <p><strong>Resolution:</strong> <span id="resolution">N/A</span></p>
                    <p><strong>Area size:</strong> <span id="area_size">N/A</span></p>
                </div>
            </div>

            <!-- Output -->
            <div class="section">
                <h2>Output</h2>
                <div class="status-info">
                    <p><strong>Output file size:</strong> <span id="outFileSize">N/A</span></p>
                    <p><strong>Reduction factor:</strong> <span id="reductionFactor">N/A</span></p>
                    <p><strong>Size compared to original:</strong> <span id="sizeCompared">N/A</span></p>
                    <p><strong>Computing time:</strong> <span id="sarProcTime">N/A</span></p>
                </div>
            </div>

            <!-- Run / Reset -->
            <div class="buttons-row">
                <button id="sarRunButton" class="buttonBlue-sar" onclick="sendRun()">Run</button>
                <button id="sarResetButton" class="buttonRed-sar" onclick="resetMenu()">Reset</button>
            </div>
        </div>

        <!-- ================= Right: image windows ================= -->
        <div class="images-row">
            <div class="sar-image-container">
                <div id="noData1" class="no-data-overlay">No data</div>
                <img id="processedImage1">
            </div>
            <div class="sar-image-container">
                <div id="noData2" class="no-data-overlay">No data</div>
                <img id="processedImage2">
            </div>
        </div>
    </div>

    <script>
        // Served by the same Flask app (combined_hpc.py) that exposes the API,
        // so every request is same-origin — no host/port/scheme juggling needed.
        var FLASK_BASE = window.location.origin;

        // Runtime state (in-memory only; a full page reload starts fresh via resetMenu()).
        var lastTifFilename = "lastFile";
        var lastCphdFilename = null;
        var sarInputProps = null;    // CPHD input file properties
        var sarOutputProps = null;   // TIF output properties
        var sarShowImage1 = false;
        var sarShowImage2 = false;
        var sarProcStartTime = null; // start time for SAR processing (ms epoch)
        var sarRunSession = 0;       // bumped on each run/reset to abort a stale poller
        var sarRunning = false;      // true while a SAR process is in progress
        var sarRunPending = false;   // true from the Run click until the run starts
        var sarStatus = "";          // last status message
        var sarSelectedInput = null; // currently selected CPHD file
        var sarInputFileList = [];   // options currently in the input dropdown

        // Input-picker refresh guards.
        var sarMenuRefreshInFlight = false; // guards against overlapping refreshes
        var sarPendingFileList = null;      // list that arrived while the menu was open
        // Throttle for the old hover-driven refresh; unused now that the list is
        // fetched only on load/Reset:
        // var sarLastRefreshTs = 0;

        // ---- small DOM helpers ----
        function sarSetText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
        function setStatusDom(text) { var el = document.getElementById("status"); if (el) el.textContent = text; }
        function setStatus(text) { sarStatus = text; if (!window._sarTransientActive) setStatusDom(text); }

        function showTransientStatus(text, ms) {
            window._sarTransientActive = true;
            setStatusDom(text);
            if (window._sarTransientTimer) clearTimeout(window._sarTransientTimer);
            window._sarTransientTimer = setTimeout(function () {
                window._sarTransientActive = false;
                window._sarTransientTimer = null;
                setStatusDom(sarStatus);
            }, ms);
        }

        // ---- elapsed-time display timer ----
        function startSarTimer() {
            if (window._sarTimerInterval) clearInterval(window._sarTimerInterval);
            window._sarTimerInterval = setInterval(function () {
                if (!sarProcStartTime) return;
                var elapsed = (Date.now() - sarProcStartTime) / 1000;
                sarSetText("sarProcTime", elapsed.toFixed(2) + "s");
            }, 100);
        }
        function stopSarTimer() {
            if (window._sarTimerInterval) { clearInterval(window._sarTimerInterval); window._sarTimerInterval = null; }
        }

        // Clear run results but KEEP the input dropdown selection/list.
        function clearResultState() {
            sarInputProps = null;
            sarOutputProps = null;
            sarShowImage1 = false;
            sarShowImage2 = false;
            lastCphdFilename = null;
            sarRunning = false;
            updateRunButtonState();
        }

        // Full reset, including the input dropdown selection/list and the timer.
        function clearAllState() {
            stopSarTimer();
            sarInputProps = null;
            sarOutputProps = null;
            sarShowImage1 = false;
            sarShowImage2 = false;
            lastCphdFilename = null;
            sarRunning = false;
            sarRunPending = false;
            sarProcStartTime = null;
            sarStatus = "";
            sarSelectedInput = null;
            sarInputFileList = [];
        }

        function getFrequencyBand(freqHz) {
            const bands = [
                { name: "HF",  min: 3e6,   max: 30e6   },
                { name: "VHF", min: 30e6,  max: 300e6  },
                { name: "UHF", min: 300e6, max: 1e9    },
                { name: "L",   min: 1e9,   max: 2e9    },
                { name: "S",   min: 2e9,   max: 4e9    },
                { name: "C",   min: 4e9,   max: 8e9    },
                { name: "X",   min: 8e9,   max: 12e9   },
                { name: "Ku",  min: 12e9,  max: 18e9   },
                { name: "K",   min: 18e9,  max: 27e9   },
                { name: "Ka",  min: 27e9,  max: 40e9   },
                { name: "V",   min: 40e9,  max: 75e9   },
                { name: "W",   min: 75e9,  max: 110e9  },
                { name: "mm",  min: 110e9, max: 300e9  },
            ];
            const match = bands.find(b => freqHz >= b.min && freqHz < b.max);
            return match ? match.name : null;
        }

        // ================= Input picker =================
        // Pending counts as running here: from the Run click onwards the input
        // selection is already committed to the run, so changing it must not
        // take effect.
        function sarIsRunning() {
            return (typeof sarRunning !== "undefined" && sarRunning) ||
                   (typeof sarRunPending !== "undefined" && sarRunPending);
        }

        function sarGuardInteraction(event) {
            if (sarIsRunning()) {
                if (event) event.preventDefault();
                return false;
            }
            return true;
        }

        function sarMenuIsOpen() {
            var select = document.getElementById("menu_sar_input_data");
            return !!select && document.activeElement === select;
        }

        function sarApplyFileList(files) {
            var select = document.getElementById("menu_sar_input_data");
            if (!select) return;
            files = files || [];

            if (files.length === 0) {
                select.innerHTML = '<option value="" disabled selected>No files available</option>';
                var sz = document.getElementById("cphd_file_size");
                if (sz) sz.textContent = "N/A";
                sarInputFileList = [];
                return;
            }

            var current = Array.prototype.map.call(select.options, function (o) { return o.value; })
                               .filter(function (v) { return v !== ""; });
            var changed = current.length !== files.length ||
                          files.some(function (f, i) { return f !== current[i]; });

            if (changed) {
                var keep = select.value;
                select.innerHTML = '';
                // Keep the prompt as the closed-menu label until the user picks a
                // file. `hidden` keeps it out of the open dropdown list (so it's
                // not a greyed line) while still allowing the first real file to be
                // selected — which fires onchange/sendLoad.
                var placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = 'Click to choose input data';
                placeholder.disabled = true;
                placeholder.hidden = true;
                select.appendChild(placeholder);
                files.forEach(function (file) {
                    var option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    select.appendChild(option);
                });
                // Restore the previous pick if it's still in the list; otherwise
                // leave the prompt selected rather than auto-choosing a file.
                if (keep && files.indexOf(keep) !== -1) select.value = keep;
                else placeholder.selected = true;
            }

            sarInputFileList = files;
            sarSelectedInput = select.value || sarSelectedInput;
        }

        // Fetch the CPHD list. Called on page load and on Reset only, so the
        // option list stays stable for the whole life of a selection.
        function refresh_sar_input_list() {
            if (sarIsRunning()) return;
            if (sarMenuRefreshInFlight) return;
            // Hover-spam throttle, disabled with the hover trigger: it would
            // swallow a Reset clicked within 1.5s of the load-time fetch.
            // if (Date.now() - sarLastRefreshTs < 1500) return;
            // sarLastRefreshTs = Date.now();
            sarMenuRefreshInFlight = true;
            setStatus("");

            fetch(`${FLASK_BASE}/send_message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "4" })
            })
            .then(function () { return new Promise(function (res) { setTimeout(res, 500); }); })
            .then(function () { return fetch(`${FLASK_BASE}/get_cphd_files`); })
            .then(function (response) { return response.json(); })
            .then(function (data) {
                var files = data.files || [];
                var select = document.getElementById("menu_sar_input_data");
                var hasOptions = !!select && Array.prototype.some.call(select.options, function (o) { return o.value !== ""; });
                if (!sarMenuIsOpen() || !hasOptions) {
                    sarApplyFileList(files);
                } else {
                    sarPendingFileList = files;
                }
            })
            .catch(function (error) {
                console.error('Error fetching CPHD files:', error);
                setStatus("Error fetching file list.");
            })
            .finally(function () { sarMenuRefreshInFlight = false; });
        }

        function sarFlushPendingFileList() {
            if (sarPendingFileList !== null) {
                var files = sarPendingFileList;
                sarPendingFileList = null;
                sarApplyFileList(files);
            }
        }

        function fetch_properties_sar_input_data() {
            var selectedFile = document.getElementById("menu_sar_input_data").value;
            if (!selectedFile) return;

            fetch(FLASK_BASE + '/get_cphd_file_properties')
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    var props = { cphd_file_size: 'N/A', total_pulses: 'N/A', centre_freq: 'N/A', img_size: 'N/A', resolution: 'N/A', area_size: 'N/A' };
                    if (data.files.filename === selectedFile) {
                        props.cphd_file_size = data.files.size;
                        if (data.files.metadata) {
                            var m = data.files.metadata;
                            props.total_pulses = m.numVectors != null ? m.numVectors.toLocaleString() : 'N/A';
                            if (m.fxC != null) {
                                var band = getFrequencyBand(m.fxC);
                                props.centre_freq = (m.fxC / 1e9).toFixed(1) + ' GHz' + (band ? ' (' + band + ' band)' : '');
                            }
                            props.img_size = (m.numLines != null && m.numSamples != null) ? m.numLines + ' x ' + m.numSamples : 'N/A';
                            props.resolution = m.lineSpacing != null ? m.lineSpacing.toFixed(2) + ' meters' : 'N/A';
                            if (m.numLines != null && m.lineSpacing != null && m.numSamples != null && m.sampleSpacing != null) {
                                props.area_size = (m.numLines * m.lineSpacing * m.numSamples * m.sampleSpacing / 1e6).toFixed(2) + ' km²';
                            }
                        }
                    }
                    sarSetText("cphd_file_size", props.cphd_file_size);
                    sarSetText("total_pulses", props.total_pulses);
                    sarSetText("centre_freq", props.centre_freq);
                    sarSetText("img_size", props.img_size);
                    sarSetText("resolution", props.resolution);
                    sarSetText("area_size", props.area_size);
                    sarInputProps = props;
                    // Input properties are now on screen — enable Run and drop the loading text.
                    updateRunButtonState();
                    setStatus("");
                })
                .catch(function (error) { console.error("Error fetching file size:", error); });
        }

        async function sendLoad() {
            const select = document.getElementById("menu_sar_input_data");
            const selectedOption = select.value;

            if (!selectedOption) {
                setStatus("Please select a file first.");
                return;
            }

            // Don't tear down an in-progress run by loading a new file.
            if (sarRunning) {
                showTransientStatus("SAR process is already running.", 3000);
                if (sarSelectedInput) select.value = sarSelectedInput;
                updateRunButtonState();
                return;
            }

            clearResultState();
            sarSelectedInput = selectedOption;

            setStatus("Loading input data ...");
            sarSetText("total_pulses", "N/A");
            sarSetText("cphd_file_size", "N/A");
            sarSetText("img_size", "N/A");
            sarSetText("resolution", "N/A");
            sarSetText("area_size", "N/A");
            sarSetText("centre_freq", "N/A");
            clearProcessedImage();
            clearColorizedImage();
            sarSetText("outFileSize", "N/A");
            sarSetText("reductionFactor", "N/A");
            sarSetText("sizeCompared", "N/A");
            sarSetText("sarProcTime", "N/A");

            try {
                await fetch(`${FLASK_BASE}/send_message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `SIZE:${selectedOption}` })
                });

                const startTime = Date.now();
                const timeout = 60 * 1000;
                while (Date.now() - startTime < timeout) {
                    const response = await fetch(`${FLASK_BASE}/get_cphd_file_properties`);
                    const data = await response.json();
                    if (data.files && data.files.filename === selectedOption) {
                        fetch_properties_sar_input_data();
                        return;
                    }
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                setStatus("Time out. Reset and try again.");
            } catch (error) {
                console.error("Error:", error);
                setStatus("Error sending command.");
            }
        }

        // ================= Image handling =================
        function fetchProcessedFile(cphdFilename) {
            fetch(`${FLASK_BASE}/images/tif_image.webp`)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch image.");
                    return response.blob();
                })
                .then(imageBlob => {
                    sarShowImage1 = true;
                    const imageUrl = URL.createObjectURL(imageBlob);
                    var img = document.getElementById("processedImage1");
                    var nd = document.getElementById("noData1");
                    if (img) {
                        // Clear "Getting output image ..." only once the image has
                        // actually decoded and painted, not merely on src assignment.
                        img.onload = function () { setStatus(""); };
                        img.onerror = function () { setStatus(""); };
                        img.src = imageUrl;
                        img.style.display = "block";
                    } else {
                        setStatus("");
                    }
                    if (nd) nd.style.display = "none";
                    setTimeout(() => fetchColorizedImage(cphdFilename), 3000);
                })
                .catch(() => {
                    setStatus("");
                    var img = document.getElementById("processedImage1");
                    var nd = document.getElementById("noData1");
                    if (img) img.style.display = "none";
                    if (nd) nd.style.display = "flex";
                });
        }

        function fetchColorizedImage(cphdFilename) {
            if (!cphdFilename) return;
            const timeout = 30 * 1000;
            const interval = 2000;
            const start = Date.now();
            function poll() {
                fetch(`${FLASK_BASE}/sar_colored_image?filename=${encodeURIComponent(cphdFilename)}`)
                    .then(response => {
                        if (!response.ok) throw new Error("not ready");
                        return response.blob();
                    })
                    .then(blob => {
                        sarShowImage2 = true;
                        var img = document.getElementById("processedImage2");
                        var nd = document.getElementById("noData2");
                        if (img) { img.src = URL.createObjectURL(blob); img.style.display = "block"; }
                        if (nd) nd.style.display = "none";
                    })
                    .catch(() => {
                        if (Date.now() - start < timeout) setTimeout(poll, interval);
                    });
            }
            poll();
        }

        // Tear down the processed image. The handlers must go before the src:
        // they clear the status line, and dropping the src fires one last
        // load/error event that would wipe the status of whatever is starting now.
        function clearProcessedImage() {
            var img = document.getElementById("processedImage1");
            if (img) {
                img.onload = null;
                img.onerror = null;
                img.removeAttribute("src");
                img.style.display = "none";
            }
            var nd = document.getElementById("noData1");
            if (nd) nd.style.display = "flex";
        }

        function clearColorizedImage() {
            var img = document.getElementById("processedImage2");
            if (img) { img.src = ""; img.style.display = "none"; }
            var nd = document.getElementById("noData2");
            if (nd) nd.style.display = "flex";
        }

        // ================= Run / Reset =================
        function updateRunButtonState() {
            var resetBtn = document.getElementById("sarResetButton");
            if (resetBtn) {
                resetBtn.textContent = sarRunning ? "Stop" : "Reset";
                // Neither button does anything useful until the RUN command has
                // landed, so gray both out for that gap rather than leave them
                // looking live while nothing happens.
                if (sarRunPending) resetBtn.classList.add("disabled");
                else resetBtn.classList.remove("disabled");
            }

            var btn = document.getElementById("sarRunButton");
            if (!btn) return;
            if (sarRunning) btn.classList.add("running");
            else btn.classList.remove("running");

            // Run is only clickable once input data properties are loaded.
            // While waiting for them (sarInputProps === null) and not already
            // running, gray the button out and block clicks.
            var inputReady = sarInputProps !== null;
            if (sarRunPending || (!sarRunning && !inputReady)) btn.classList.add("disabled");
            else btn.classList.remove("disabled");
        }

        async function sendRun() {
            if (sarRunning) {
                showTransientStatus("SAR process is already running.", 3000);
                return;
            }

            // Input data must be loaded before a run can start.
            if (sarInputProps === null) {
                showTransientStatus("Load input data first.", 3000);
                return;
            }

            const selectedOption = (document.getElementById("menu_sar_input_data") || {}).value || sarSelectedInput;
            if (!selectedOption) {
                setStatus("Please select a file first.");
                return;
            }

            const runSession = ++sarRunSession;

            // Gray both buttons out now, on the click itself: the RUN command
            // can take a moment to land, and until it does a second click would
            // just queue up commands the backend never asked for.
            sarRunPending = true;
            updateRunButtonState();

            lastTifFilename = null;
            lastCphdFilename = selectedOption;
            sarSelectedInput = selectedOption;
            sarOutputProps = null;
            sarShowImage1 = false;
            sarShowImage2 = false;

            try {
                // Send the "RUN" command
                await fetch(`${FLASK_BASE}/send_message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `RUN:${selectedOption}` })
                });

                // Reset images
                clearProcessedImage();
                clearColorizedImage();
                sarSetText("outFileSize", "N/A");
                sarSetText("reductionFactor", "N/A");
                sarSetText("sizeCompared", "N/A");

                // START TIMER — mark the run active before starting the elapsed timer.
                sarRunning = true;
                sarProcStartTime = Date.now();
                sarSetText("sarProcTime", "0.00s");
                sarRunPending = false;  // Reset becomes "Stop" and is live again
                updateRunButtonState();
                startSarTimer();

                await runSarPoller(selectedOption, runSession);
            } catch (error) {
                console.error("Error:", error);
                setStatus("Error sending command.");
            } finally {
                // Covers the failed-RUN path, where the run never started and
                // the buttons would otherwise stay grayed out for good. Only the
                // current run may clear the flag: a superseded run unwinding late
                // must not un-gray the buttons on behalf of its replacement.
                if (sarRunSession === runSession) {
                    sarRunPending = false;
                    updateRunButtonState();
                }
            }
        }

        async function runSarPoller(cphdFilename, runSession) {
            window._sarPollerActive = true;
            try {
                const startTime = Date.now();
                const timeout = 900 * 1000;
                let fileUpdated = false;

                while (!fileUpdated && sarRunSession === runSession && (Date.now() - startTime < timeout)) {
                    const response = await fetch(`${FLASK_BASE}/get_tif_file_properties`);
                    const data = await response.json();
                    if (sarRunSession !== runSession) return;

                    // The SAR program terminated without producing new output — the
                    // card/server is unresponsive. Stop the elapsed timer and show
                    // the restart prompt instead of waiting out the full timeout.
                    if (data.error) {
                        stopSarTimer();
                        sarRunning = false;
                        sarSetText("sarProcTime", "N/A");
                        setStatus(data.error);
                        updateRunButtonState();
                        return;
                    }

                    if (data.files.tif_filename && data.files.tif_filename !== lastTifFilename) {
                        // The run is done, but the image still has to come over the
                        // wire — keep the user informed until it is on screen.
                        setStatus("Getting output image ...");

                        stopSarTimer();
                        const finalElapsed = (Date.now() - sarProcStartTime) / 1000;
                        sarSetText("sarProcTime", finalElapsed.toFixed(2) + "s");

                        var outSize = data.files.size;
                        var outReduction = "x" + data.files.reduction_scale + " or " + data.files.reduction_factor + "%";
                        var outSizeCompared = data.files.size_compared + "%";
                        var outProcTime = finalElapsed.toFixed(2) + "s";
                        sarSetText("outFileSize", outSize);
                        sarSetText("reductionFactor", outReduction);
                        sarSetText("sizeCompared", outSizeCompared);

                        if (data.files.tif_resolution != null) {
                            var res = data.files.tif_resolution.toFixed(2) + " meters";
                            sarSetText("resolution", res);
                            if (sarInputProps) sarInputProps.resolution = res;
                        }

                        sarOutputProps = { outFileSize: outSize, reductionFactor: outReduction, sizeCompared: outSizeCompared, sarProcTime: outProcTime };
                        sarRunning = false;
                        lastTifFilename = data.files.tif_filename;
                        updateRunButtonState();

                        fetchProcessedFile(cphdFilename);

                        fileUpdated = true;
                    } else {
                        setStatus("Processing CPHD file ...");
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                }

                if (sarRunSession !== runSession) {
                    return;
                } else if (!fileUpdated) {
                    stopSarTimer();
                    sarRunning = false;
                    updateRunButtonState();
                }
            } catch (error) {
                console.error("Error:", error);
                setStatus("Error sending command.");
            } finally {
                window._sarPollerActive = false;
            }
        }

        function resetMenu() {
            sarRunSession++;        // abort any in-flight poller
            clearAllState();        // stops the timer, resets all in-memory state incl. selection
            updateRunButtonState(); // re-enable the Run button (sarRunning now false)
            lastTifFilename = "lastFile";

            // Ask the backend to Ctrl+C the SAR program (no-op if none running),
            // then send the normal reset command.
            fetch(`${FLASK_BASE}/send_message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "STOPSAR" })
            })
            .catch(error => { console.error("Error sending STOPSAR:", error); })
            .then(() => fetch(`${FLASK_BASE}/send_message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "3" })
            }))
            .then(response => response.json())
            .catch(error => {
                console.error("Error:", error);
                setStatus("Error sending command.");
            })
            // Rebuild the option list once the reset commands have landed, so
            // the "4" query doesn't race STOPSAR/"3" on the backend.
            .then(() => refresh_sar_input_list());

            var sel = document.getElementById("menu_sar_input_data");
            if (sel) sel.innerHTML = '<option value="" disabled selected>Click to choose input data</option>';
            sarSetText("status", "");
            sarSetText("total_pulses", "N/A");
            sarSetText("cphd_file_size", "N/A");
            sarSetText("img_size", "N/A");
            sarSetText("resolution", "N/A");
            sarSetText("area_size", "N/A");
            sarSetText("centre_freq", "N/A");
            clearProcessedImage();
            clearColorizedImage();
            sarSetText("outFileSize", "N/A");
            sarSetText("reductionFactor", "N/A");
            sarSetText("sizeCompared", "N/A");
            sarSetText("sarProcTime", "N/A");
        }

        // ---- boot ----
        // On every page load / refresh (and the very first open), start fresh:
        // behave exactly as if the user had clicked the Reset button — this
        // stops any in-progress SAR job and clears the input selection, images
        // and status fields.
        updateRunButtonState();
        resetMenu();
    </script>
</body>
</html>
