<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }

        .profiler-images-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .profiler-image-container {
            position: relative;
            flex: 1;
            min-width: 0;
            background-color: #181b1f;
            border: 2px solid #28292f;
            overflow: hidden;
        }

        .profiler-image-container img-profiler {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .no-data-overlay-profiler {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(204, 204, 220, 0.65);
            font-size: 18px;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div id="wrapper">
    <div class="profiler-images-row">
        <div class="profiler-image-container">
            <div id="noData_profiler" class="no-data-overlay-profiler">No data</div>
            <img id="profiler_overall_cpu_usage">
        </div>
        <div class="profiler-image-container">
            <div id="noData_profiler" class="no-data-overlay-profiler">No data</div>
            <img id="profiler_cpu_power">
        </div>
    </div>
    <div class="profiler-images-row">
        <div class="profiler-image-container">
            <div id="noData_profiler" class="no-data-overlay-profiler">No data</div>
            <img id="profiler_cpu_cores_usage">
        </div>
        <div class="profiler-image-container">
            <div id="noData_profiler" class="no-data-overlay-profiler">No data</div>
            <img id="profiler_cpu_cores_frequency">
        </div>
    </div>
    <div class="profiler-images-row">
        <div class="profiler-image-container">
            <div id="noData_profiler" class="no-data-overlay-profiler">No data</div>
            <img id="profiler_cpu_temperature">
        </div>
        <div class="profiler-image-container">
            <div id="noData_profiler" class="no-data-overlay-profiler">No data</div>
            <img id="profiler_memory_usage">
        </div>
    </div>
    </div>

    <script>
        const isDirectAccess = window.location.port === '3000';
        FLASK_BASE = isDirectAccess
            ? `http://${window.location.hostname}:5000`
            : `https://${window.location.hostname}`

        function updateAnalysis() {
            fetch(`${FLASK_BASE}/process_analysis`)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch image.");
                    return response.blob();
                })
                
        }

        // Fired while panel was collapsed — show on mount
        if (localStorage.getItem('update_analysis_pending')) {
            updateAnalysis();
        }

        // Fired while panel is visible
        if (!window._helloListenerAdded) {
            window._helloListenerAdded = true;
            window.addEventListener('update_analysis', updateAnalysis);
        }
    </script>
</body>
</html>
