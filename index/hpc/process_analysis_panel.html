<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }

        .profiler-images-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .profiler-image-container {
            position: relative;
            flex: 1;
            min-width: 0;
            background-color: #181b1f;
            border: 2px solid #28292f;
            overflow: hidden;
        }

        .profiler-image-container .img-profiler {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .no-data-overlay-profiler {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(204, 204, 220, 0.65);
            font-size: 18px;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div id="wrapper">
    <div class="profiler-images-row">
        <div class="profiler-image-container">
            <div class="no-data-overlay-profiler">No data</div>
            <img class="img-profiler" id="profiler_overall_cpu_usage">
        </div>
        <div class="profiler-image-container">
            <div class="no-data-overlay-profiler">No data</div>
            <img class="img-profiler" id="profiler_cpu_power">
        </div>
    </div>
    <div class="profiler-images-row">
        <div class="profiler-image-container">
            <div class="no-data-overlay-profiler">No data</div>
            <img class="img-profiler" id="profiler_cpu_cores_usage">
        </div>
        <div class="profiler-image-container">
            <div class="no-data-overlay-profiler">No data</div>
            <img class="img-profiler" id="profiler_cpu_cores_frequency">
        </div>
    </div>
    <div class="profiler-images-row">
        <div class="profiler-image-container">
            <div class="no-data-overlay-profiler">No data</div>
            <img class="img-profiler" id="profiler_cpu_temperature">
        </div>
        <div class="profiler-image-container">
            <div class="no-data-overlay-profiler">No data</div>
            <img class="img-profiler" id="profiler_memory_usage">
        </div>
    </div>
    </div>

    <script>
        (function () {
            const isDirectAccess_profiler = window.location.port === '3000';
            const FLASK_BASE_PROFILER = isDirectAccess_profiler
                ? `http://${window.location.hostname}:5000`
                : `https://${window.location.hostname}`;

            const IMAGE_MAP = [
                { id: 'profiler_overall_cpu_usage',   type: 'overall_cpu_usage'   },
                { id: 'profiler_cpu_power',            type: 'cpu_power'           },
                { id: 'profiler_cpu_cores_usage',      type: 'cpu_cores_usage'     },
                { id: 'profiler_cpu_cores_frequency',  type: 'cpu_cores_frequency' },
                { id: 'profiler_cpu_temperature',      type: 'cpu_temperature'     },
                { id: 'profiler_memory_usage',         type: 'memory_usage'        },
            ];

            function clearAnalysis() {
                IMAGE_MAP.forEach(({ id }) => {
                    const img = document.getElementById(id);
                    img.src = '';
                    img.style.display = 'none';
                    img.previousElementSibling.style.display = 'flex';
                });
            }

            function updateAnalysis() {
                clearAnalysis();
                const bust = Date.now();
                IMAGE_MAP.forEach(({ id, type }) => {
                    const img = document.getElementById(id);
                    img.onload = () => {
                        img.style.display = 'block';
                        img.previousElementSibling.style.display = 'none';
                    };
                    img.onerror = () => {
                        img.src = '';
                        img.style.display = 'none';
                        img.previousElementSibling.style.display = 'flex';
                    };
                    img.src = `${FLASK_BASE_PROFILER}/sar_log/image/${type}?t=${bust}`;
                });
            }

            // Fired while panel was collapsed — show on mount
            if (localStorage.getItem('update_analysis_pending')) {
                localStorage.removeItem('update_analysis_pending');
                updateAnalysis();
            }

            // Replace with fresh closure each render so the listener always uses
            // the current updateAnalysis (stale closures break after re-injection)
            if (window._analysisUpdateHandler) {
                window.removeEventListener('update_analysis', window._analysisUpdateHandler);
            }
            window._analysisUpdateHandler = function () {
                // If DOM is detached (row collapsed), preserve flag for on-mount check
                if (!document.getElementById('profiler_overall_cpu_usage')) return;
                localStorage.removeItem('update_analysis_pending');
                updateAnalysis();
            };
            window.addEventListener('update_analysis', window._analysisUpdateHandler);

            // Fired by the SAR Reset button (resetMenu). Wipe the profiler images.
            // If the row is collapsed the images aren't in the DOM anyway, and the
            // reset already cleared the pending-update flag, so nothing will bring
            // them back on re-expand.
            if (window._analysisClearHandler) {
                window.removeEventListener('clear_analysis', window._analysisClearHandler);
            }
            window._analysisClearHandler = function () {
                if (!document.getElementById('profiler_overall_cpu_usage')) return;
                clearAnalysis();
            };
            window.addEventListener('clear_analysis', window._analysisClearHandler);
        })();
    </script>
</body>
</html>
