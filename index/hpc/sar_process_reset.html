<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .sar-reset-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .buttonRed-sar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 40px;
            border-radius: 2px;
            background-color: #ca2715;
            color: white;
            border: none;
            cursor: pointer;
        }
        .buttonRed-sar:hover {
            background-color: #ff4c47;
        }
    </style>
</head>
<body>
    <div class="sar-reset-wrapper">
        <button id="sarResetButton" class="buttonRed-sar" onclick="resetMenu()">Reset</button>
    </div>

    <script>
        // Label reflects SAR state: "Stop" while a process is running (this button
        // also sends STOPSAR to the target), otherwise "Reset". Set it on every
        // (re-)execution so it is correct when this Grafana row re-expands mid-run.
        // Live transitions are driven by updateRunButtonState() in the image panel;
        // sarRunning is a shared global defined there.
        (function () {
            var btn = document.getElementById("sarResetButton");
            if (btn) btn.textContent = (typeof sarRunning !== "undefined" && sarRunning) ? "Stop" : "Reset";
        })();
    </script>
</body>
</html>
