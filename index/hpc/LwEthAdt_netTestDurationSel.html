<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LwEthAdt Net Test Duration Selector</title>
    <style>
        .container-EthAdtNetTest {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            height: 100%;
            margin: 0;
            max-width: 100%;
            padding-left: 0;
            padding-right: 0;
        }

        .dropdown-container-EthAdtNetTest {
            display: flex;
            flex-direction: column;
            border-radius: 2px;
        }

        #durationDropdown_LwEthAdt {
            font-size: 14px;
            width: 200px;
            height: 40px;
            border-radius: 2px;
        }

        .status-container-EthAdtNetTest {
            font-size: 14px;
            height: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-EthAdtNetTest">
        <div class="dropdown-container-EthAdtNetTest">
            <p>Test duration</p>
            <select id="durationDropdown_LwEthAdt" 
                onchange="setTestDuration_LwEthAdt()">
            </select>
            <div class="status-container-EthAdtNetTest">
                <p id="statusNet_LwEthAdt">&nbsp;</p>
            </div>
        </div>
    </div>

    <script>
        // Persist selection in-memory on `window` so it survives Grafana row
        // collapse/expand (JS scope stays alive) but resets to "Select Duration"
        // on a real page reload. The guard prevents the value being wiped when
        // the script re-executes on row re-expand. `var` (not `let`) is required
        // because top-level `let` throws redeclaration on that re-execution.
        if (typeof window.testDurationLwEthAdt === "undefined") {
            window.testDurationLwEthAdt = null;
        }
        var testDurationLwEthAdt;

        function populateDurationDropdown_LwEthAdt() {
            let dropdown = document.getElementById("durationDropdown_LwEthAdt");
            if (!dropdown) return;

            dropdown.innerHTML = "";
            dropdown.removeEventListener("change", setTestDuration_LwEthAdt);
            dropdown.addEventListener("change", setTestDuration_LwEthAdt);

            let defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Select Duration";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            dropdown.appendChild(defaultOption);

            for (let i = 5; i <= 60; i += 5) {
                let option = document.createElement("option");
                option.value = i;
                option.textContent = `${i} seconds`;
                dropdown.appendChild(option);
            }

            // Restore in-memory selection so it survives row collapse/expand.
            // On a fresh page load window.testDurationLwEthAdt is null, so the
            // dropdown stays on the disabled "Select Duration" default.
            if (window.testDurationLwEthAdt != null) {
                dropdown.value = String(window.testDurationLwEthAdt);
            }
        }

        function setTestDuration_LwEthAdt() {
            document.getElementById("statusNet_LwEthAdt").textContent = "";
            document.getElementById("upBW_LwEthAdt").textContent = "N/A";
            document.getElementById("upLat_LwEthAdt").textContent = "N/A";
            document.getElementById("upLostTotal_LwEthAdt").textContent = "N/A";
            document.getElementById("downBW_LwEthAdt").textContent = "N/A";
            document.getElementById("downLat_LwEthAdt").textContent = "N/A";
            document.getElementById("downLostTotal_LwEthAdt").textContent = "N/A";
            const dropdown = document.getElementById("durationDropdown_LwEthAdt");
            window.testDurationLwEthAdt = parseInt(dropdown.value, 10);
            document.getElementById("statusNet_LwEthAdt").textContent = "";

            localStorage.setItem("panelSync", JSON.stringify({
                type: "duration",
                value: dropdown.value
            }));
        }

        // MutationObserver: fires only on actual DOM changes — zero cost at idle.
        // Catches both the initial insert and any re-insert after row collapse/expand.
        var _observer = new MutationObserver(function () {
            var dropdown = document.getElementById("durationDropdown_LwEthAdt");
            if (dropdown && dropdown.options.length === 0) {
                populateDurationDropdown_LwEthAdt();
            }
        });
        _observer.observe(document.body, { childList: true, subtree: true });

        // Also try immediately in case the element is already present
        populateDurationDropdown_LwEthAdt();
    </script>
</body>
</html>
