<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dropdown-container {
            display: flex;
            flex-direction: column;
            border-radius: 2px;
        }

        .status-container {
            font-size: 14px;
            height: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .images-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            flex: 1;
            height: 100%;
            min-height: 0;
        }

        .sar-image-container {
            position: relative;
            flex: 1;
            min-width: 0;
            background-color: #181b1f;
            border: 2px solid #28292f;
            overflow: hidden;
        }

        .sar-image-container img {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .no-data-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(204, 204, 220, 0.65);
            font-size: 18px;
            pointer-events: none;
        }
        
        /* Make each <p> for the information data a flex container for label and data alignment */
        .status-info p {
            display: flex;
            justify-content: space-between; /* Distribute the label and data across the width */
            align-items: center; /* Vertically center both the label and the data */
        }

        #durationDropdown_LwEthOnb {
            width: 200px;
        }
        #bwDropdown_LwEthOnb {
            width: 200px;
        }
        #durationDropdown_UpEthOnb {
            width: 200px;
        }
        #bwDropdown_UpEthOnb {
            width: 200px;
        }
        #bwDropdown_LwEthAdt {
            width: 200px;
        }
        #bwDropdown_UpEthAdt {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="images-row">
        <div class="sar-image-container">
            <div id="noData1" class="no-data-overlay">No data</div>
            <img id="processedImage1">
        </div>
        <div class="sar-image-container">
            <div id="noData2" class="no-data-overlay">No data</div>
            <img id="processedImage2">
        </div>
    </div>

    <script>
        var isDirectAccess = window.location.port === '3000';
        FLASK_BASE = isDirectAccess
            ? `http://${window.location.hostname}:5000`
            : `https://${window.location.hostname}`

        var SAR_STATE_KEY = 'sarPanelState_v1';

        // --- Runtime state that MUST survive Grafana row collapse/expand ---
        // On row expand Grafana re-executes this whole script in the same global
        // scope. A plain `var x = 0;` re-runs the assignment and would clobber the
        // state of an in-flight run (aborting its poller / orphaning its timer).
        // Declaring the vars bare (no initializer) leaves any existing value
        // untouched on re-execution; we seed defaults only once, guarded by a
        // window flag. Live handles (timer id, poller flag) live on `window` so a
        // re-execution can still see and manage them.
        var lastTifFilename, lastCphdFilename, sarInputProps, sarOutputProps,
            sarShowImage1, sarShowImage2, sarProcStartTime, sarRunSession,
            sarRunning, sarStatus, sarSelectedInput, sarInputFileList,
            testDurationLwEthOnb, testDurationUpEthOnb;
        if (!window._sarRuntimeInit) {
            window._sarRuntimeInit = true;
            lastTifFilename = "lastFile";
            lastCphdFilename = null;
            sarInputProps = null;   // CPHD input file properties
            sarOutputProps = null;  // TIF output properties
            sarShowImage1 = false;
            sarShowImage2 = false;
            sarProcStartTime = null; // start time for SAR processing (ms epoch)
            sarRunSession = 0;       // bumped on each run/reset to abort a stale poller
            sarRunning = false;      // true while a SAR process is in progress
            sarStatus = "";          // last status message
            sarSelectedInput = null; // currently selected CPHD file
            sarInputFileList = [];   // options currently in the input dropdown
            testDurationLwEthOnb = null;
            testDurationUpEthOnb = null;
        }

        // Null-guarded DOM helpers — elements are absent while the row is collapsed.
        function sarSetText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
        function setStatusDom(text) { var el = document.getElementById("status"); if (el) el.textContent = text; }
        function setStatus(text) { sarStatus = text; setStatusDom(text); saveState(); }

        // Display timer. Its id lives on window so a script re-execution (row
        // expand) can never orphan a running interval, and the callback is
        // null-guarded so it keeps ticking harmlessly while the row is collapsed.
        function startSarTimer() {
            if (window._sarTimerInterval) clearInterval(window._sarTimerInterval);
            window._sarTimerInterval = setInterval(function() {
                if (!sarProcStartTime) return;
                var elapsed = (Date.now() - sarProcStartTime) / 1000;
                sarSetText("sarProcTime", elapsed.toFixed(2) + "s");
            }, 100);
        }
        function stopSarTimer() {
            if (window._sarTimerInterval) { clearInterval(window._sarTimerInterval); window._sarTimerInterval = null; }
        }

        (function initImagesDom() {
            var n1 = document.getElementById("noData1"); if (n1) n1.style.display = "flex";
            var n2 = document.getElementById("noData2"); if (n2) n2.style.display = "flex";
            var p1 = document.getElementById("processedImage1"); if (p1) p1.style.display = "none";
            var p2 = document.getElementById("processedImage2"); if (p2) p2.style.display = "none";
        })();

        function saveState() {
            localStorage.setItem(SAR_STATE_KEY, JSON.stringify({
                lastTifFilename: lastTifFilename,
                cphdFilename: lastCphdFilename,
                inputProps: sarInputProps,
                outputProps: sarOutputProps,
                showImage1: sarShowImage1,
                showImage2: sarShowImage2,
                running: sarRunning,
                startTime: sarProcStartTime,
                status: sarStatus,
                selectedInput: sarSelectedInput,
                inputFileList: sarInputFileList,
            }));
        }

        // Clear run results but KEEP the input dropdown selection/list — used when
        // the user picks a new file, so the picker survives across collapse/expand.
        function clearResultState() {
            sarInputProps = null;
            sarOutputProps = null;
            sarShowImage1 = false;
            sarShowImage2 = false;
            lastCphdFilename = null;
            sarRunning = false;
            saveState();
        }

        // Full reset, including the input dropdown selection/list and the timer.
        function clearAllState() {
            stopSarTimer();
            sarInputProps = null;
            sarOutputProps = null;
            sarShowImage1 = false;
            sarShowImage2 = false;
            lastCphdFilename = null;
            sarRunning = false;
            sarProcStartTime = null;
            sarStatus = "";
            sarSelectedInput = null;
            sarInputFileList = [];
            localStorage.removeItem(SAR_STATE_KEY);
        }

        function applyTextState() {
            var setText = function(id, val) { var el = document.getElementById(id); if (el && val != null) el.textContent = val; };
            if (sarInputProps) {
                setText("cphd_file_size", sarInputProps.cphd_file_size);
                setText("total_pulses", sarInputProps.total_pulses);
                setText("centre_freq", sarInputProps.centre_freq);
                setText("img_size", sarInputProps.img_size);
                setText("resolution", sarInputProps.resolution);
                setText("area_size", sarInputProps.area_size);
            }
            if (sarOutputProps) {
                setText("outFileSize", sarOutputProps.outFileSize);
                setText("reductionFactor", sarOutputProps.reductionFactor);
                setText("sizeCompared", sarOutputProps.sizeCompared);
                setText("sarProcTime", sarOutputProps.sarProcTime);
            }
        }

        // Rebuild the input dropdown (options + selection) from persisted state.
        // The <select> is recreated empty when the row re-expands, so we repopulate
        // it here rather than relying on the DOM surviving.
        function restoreInputDropdown() {
            var select = document.getElementById("menu_sar_input_data");
            if (!select) return;
            var files = sarInputFileList || [];
            var selected = sarSelectedInput || null;
            if (!files.length && !selected) return; // nothing to restore

            select.innerHTML = '';
            var placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select input data';
            placeholder.disabled = true;
            select.appendChild(placeholder);

            var list = files.slice();
            if (selected && list.indexOf(selected) === -1) list.push(selected);
            list.forEach(function(file) {
                var option = document.createElement('option');
                option.value = file;
                option.textContent = file;
                select.appendChild(option);
            });

            if (selected) select.value = selected;
            else placeholder.selected = true;
        }

        function restoreState() {
            var raw = localStorage.getItem(SAR_STATE_KEY);
            if (!raw) return;
            try {
                var state = JSON.parse(raw);
                if (state.lastTifFilename) lastTifFilename = state.lastTifFilename;
                if (state.cphdFilename) lastCphdFilename = state.cphdFilename;
                if (state.inputProps) sarInputProps = state.inputProps;
                if (state.outputProps) sarOutputProps = state.outputProps;
                if (state.selectedInput) sarSelectedInput = state.selectedInput;
                if (state.inputFileList) sarInputFileList = state.inputFileList;
                if (typeof state.startTime === 'number') sarProcStartTime = state.startTime;
                if (state.status != null) sarStatus = state.status;

                restoreInputDropdown();
                setStatusDom(sarStatus);

                if (state.showImage1) {
                    sarShowImage1 = true;
                    fetch(FLASK_BASE + '/images/tif_image.webp')
                        .then(function(r) { if (!r.ok) throw new Error(); return r.blob(); })
                        .then(function(blob) {
                            var img = document.getElementById("processedImage1");
                            var nd = document.getElementById("noData1");
                            if (img) { img.src = URL.createObjectURL(blob); img.style.display = "block"; }
                            if (nd) nd.style.display = "none";
                        })
                        .catch(function() {});
                }
                if (state.showImage2 && state.cphdFilename) {
                    sarShowImage2 = true;
                    fetchColorizedImage(state.cphdFilename);
                }
                setTimeout(applyTextState, 200);

                // Resume an in-progress run.
                //  - Collapse/expand: the poller and timer are still alive (their
                //    window handles survive re-execution), so we leave them running.
                //  - Full page reload: those handles are gone, so re-attach a timer
                //    and a completion poller derived from the persisted start time.
                if (state.running) {
                    sarRunning = true;
                    if (!window._sarPollerActive) {
                        window._sarPollerActive = true; // claim now to avoid a double resume
                        startSarTimer();
                        resumeSarPoller(++sarRunSession);
                    } else if (!window._sarTimerInterval) {
                        startSarTimer();
                    }
                }
            } catch (e) {
                console.error("SAR state restore error:", e);
            }
        }

        function getFrequencyBand(freqHz) {
            const bands = [
                { name: "HF",  min: 3e6,   max: 30e6   },
                { name: "VHF", min: 30e6,  max: 300e6  },
                { name: "UHF", min: 300e6, max: 1e9    },
                { name: "L",   min: 1e9,   max: 2e9    },
                { name: "S",   min: 2e9,   max: 4e9    },
                { name: "C",   min: 4e9,   max: 8e9    },
                { name: "X",   min: 8e9,   max: 12e9   },
                { name: "Ku",  min: 12e9,  max: 18e9   },
                { name: "K",   min: 18e9,  max: 27e9   },
                { name: "Ka",  min: 27e9,  max: 40e9   },
                { name: "V",   min: 40e9,  max: 75e9   },
                { name: "W",   min: 75e9,  max: 110e9  },
                { name: "mm",  min: 110e9, max: 300e9  },
            ];
            const match = bands.find(b => freqHz >= b.min && freqHz < b.max);
            return match ? match.name : null;
        }
        
        function fetchProcessedFile(cphdFilename) {
            fetch(`${FLASK_BASE}/images/tif_image.webp`)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch image.");
                    return response.blob();
                })
                .then(imageBlob => {
                    // Persist first so a collapsed row still restores the image later.
                    sarShowImage1 = true;
                    saveState();
                    const imageUrl = URL.createObjectURL(imageBlob);
                    var img = document.getElementById("processedImage1");
                    var nd = document.getElementById("noData1");
                    if (img) { img.src = imageUrl; img.style.display = "block"; }
                    if (nd) nd.style.display = "none";
                    setTimeout(() => fetchColorizedImage(cphdFilename), 3000);
                })
                .catch(() => {
                    var img = document.getElementById("processedImage1");
                    var nd = document.getElementById("noData1");
                    if (img) img.style.display = "none";
                    if (nd) nd.style.display = "flex";
                });
        }

        function fetchColorizedImage(cphdFilename) {
            if (!cphdFilename) return;
            const timeout = 30 * 1000;
            const interval = 2000;
            const start = Date.now();
            function poll() {
                fetch(`${FLASK_BASE}/sar_colored_image?filename=${encodeURIComponent(cphdFilename)}`)
                    .then(response => {
                        if (!response.ok) throw new Error("not ready");
                        return response.blob();
                    })
                    .then(blob => {
                        // Persist first so a collapsed row still restores the image later.
                        sarShowImage2 = true;
                        saveState();
                        var img = document.getElementById("processedImage2");
                        var nd = document.getElementById("noData2");
                        if (img) { img.src = URL.createObjectURL(blob); img.style.display = "block"; }
                        if (nd) nd.style.display = "none";
                    })
                    .catch(() => {
                        if (Date.now() - start < timeout) setTimeout(poll, interval);
                    });
            }
            poll();
        }

        function notifyAnalysisWhenLogsReady(baselineVersion, runSession) {
            // The output image now arrives before the profiler logs, so refresh
            // the analysis panel only once the new log folder reaches the host
            const start = Date.now();
            const timeout = 900 * 1000;
            function poll() {
                if (sarRunSession !== runSession || Date.now() - start > timeout) return;
                fetch(`${FLASK_BASE}/sar_log/status`)
                    .then(response => response.json())
                    .then(data => {
                        if (sarRunSession !== runSession) return;
                        if (baselineVersion === null || data.version !== baselineVersion) {
                            localStorage.setItem('update_analysis_pending', '1');
                            window.dispatchEvent(new CustomEvent('update_analysis'));
                        } else {
                            setTimeout(poll, 2000);
                        }
                    })
                    .catch(() => setTimeout(poll, 2000));
            }
            poll();
        }

        function clearColorizedImage() {
            var img = document.getElementById("processedImage2");
            if (img) { img.src = ""; img.style.display = "none"; }
            var nd = document.getElementById("noData2");
            if (nd) nd.style.display = "flex";
        }

        async function sendRun() {
            const selectedOption = (document.getElementById("menu_sar_input_data") || {}).value || sarSelectedInput;
            if (!selectedOption) {
                setStatus("Please select a file first.");
                return;
            }

            const runSession = ++sarRunSession;
            lastTifFilename = null;
            lastCphdFilename = selectedOption;
            sarSelectedInput = selectedOption;
            // Clear output state — new run session
            sarOutputProps = null;
            sarShowImage1 = false;
            sarShowImage2 = false;

            try {
                // Baseline log version, to detect when this run's profiler logs arrive
                let logVersionBaseline = null;
                try {
                    const logStatus = await fetch(`${FLASK_BASE}/sar_log/status`);
                    logVersionBaseline = (await logStatus.json()).version;
                } catch (e) {
                    logVersionBaseline = null;
                }

                // Send the "RUN" command
                await fetch(`${FLASK_BASE}/send_message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `RUN:${selectedOption}` })
                });

                setStatus("Command sent... Run");

                // Reset images
                var p1 = document.getElementById("processedImage1");
                if (p1) { p1.src = ""; p1.style.display = "none"; }
                var nd1 = document.getElementById("noData1");
                if (nd1) nd1.style.display = "flex";
                clearColorizedImage();
                // Reset output properties
                sarSetText("outFileSize", "N/A");
                sarSetText("reductionFactor", "N/A");
                sarSetText("sizeCompared", "N/A");

                // START TIMER — persist running state first so a full page reload
                // (or a row collapse/expand) can resume the timer from this instant.
                sarRunning = true;
                sarProcStartTime = Date.now();
                sarSetText("sarProcTime", "0.00s");
                saveState();
                startSarTimer();

                // Poll for the processed output. This runs to completion even if the
                // row is collapsed (it writes to localStorage, not just the DOM).
                await runSarPoller(selectedOption, runSession, logVersionBaseline);
            } catch (error) {
                console.error("Error:", error);
                setStatus("Error sending command.");
            }
        }

        // Poll the host for the processed output and, once it arrives, persist +
        // render the results. DOM-independent (null-guarded), so it completes
        // correctly whether or not the panel row is currently expanded.
        async function runSarPoller(cphdFilename, runSession, logVersionBaseline) {
            window._sarPollerActive = true;
            try {
                const startTime = Date.now();
                const timeout = 900 * 1000;
                let fileUpdated = false;

                while (!fileUpdated && sarRunSession === runSession && (Date.now() - startTime < timeout)) {
                    const response = await fetch(`${FLASK_BASE}/get_tif_file_properties`);
                    const data = await response.json();
                    if (sarRunSession !== runSession) return; // aborted by reset/new run

                    if (data.files.tif_filename && data.files.tif_filename !== lastTifFilename) {
                        setStatus("Getting output properties ... Data Fetched.");

                        // STOP TIMER and freeze the final elapsed time
                        stopSarTimer();
                        const finalElapsed = (Date.now() - sarProcStartTime) / 1000;
                        sarSetText("sarProcTime", finalElapsed.toFixed(2) + "s");

                        var outSize = data.files.size;
                        var outReduction = "x" + data.files.reduction_scale + " or " + data.files.reduction_factor + "%";
                        var outSizeCompared = data.files.size_compared + "%";
                        var outProcTime = finalElapsed.toFixed(2) + "s";
                        sarSetText("outFileSize", outSize);
                        sarSetText("reductionFactor", outReduction);
                        sarSetText("sizeCompared", outSizeCompared);

                        if (data.files.tif_resolution != null) {
                            var res = data.files.tif_resolution.toFixed(2) + " meters";
                            sarSetText("resolution", res);
                            if (sarInputProps) sarInputProps.resolution = res;
                        }

                        sarOutputProps = { outFileSize: outSize, reductionFactor: outReduction, sizeCompared: outSizeCompared, sarProcTime: outProcTime };
                        sarRunning = false;
                        lastTifFilename = data.files.tif_filename;
                        saveState();

                        // Fetch and display the new tif image, then colored image after 3s
                        fetchProcessedFile(cphdFilename);

                        // Refresh the analysis panel once the profiler logs arrive later
                        notifyAnalysisWhenLogsReady(logVersionBaseline, runSession);

                        fileUpdated = true;
                    } else {
                        setStatus("Waiting for processed file...");
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Wait before retrying
                    }
                }

                if (sarRunSession !== runSession) {
                    return; // aborted, leave status set by the aborter
                } else if (!fileUpdated) {
                    stopSarTimer();
                    sarRunning = false;
                    saveState();
                    setStatus("Getting output properties ... Timeout.");
                } else {
                    setStatus("Getting output properties ... Done.");
                }
            } catch (error) {
                console.error("Error:", error);
                setStatus("Error sending command.");
            } finally {
                window._sarPollerActive = false;
            }
        }

        // Resume a run whose page was fully reloaded mid-processing (the original
        // sendRun poller was destroyed). Re-establishes the analysis log baseline,
        // then re-attaches the completion poller using the persisted start time.
        async function resumeSarPoller(runSession) {
            let logVersionBaseline = null;
            try {
                const logStatus = await fetch(`${FLASK_BASE}/sar_log/status`);
                logVersionBaseline = (await logStatus.json()).version;
            } catch (e) {
                logVersionBaseline = null;
            }
            if (sarRunSession !== runSession) { window._sarPollerActive = false; return; }
            runSarPoller(lastCphdFilename || sarSelectedInput, runSession, logVersionBaseline);
        }

        function resetMenu() {
            sarRunSession++;   // abort any in-flight poller
            clearAllState();   // stops the timer, wipes persisted state incl. selection
            lastTifFilename = "lastFile";

            // Ask the backend to Ctrl+C the SAR program on the target (no-op if none
            // is running), then send the normal reset command
            fetch(`${FLASK_BASE}/send_message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "STOPSAR" })
            })
            .catch(error => {
                console.error("Error sending STOPSAR:", error);
            })
            .then(() => fetch(`${FLASK_BASE}/send_message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "3"})
            }))
            .then(response => response.json())
            .then(data => {
                // statusElement.textContent = "Command sent... Reset.";
            })
            .catch(error => {
                console.error("Error:", error);
                setStatusDom("Error sending command.");
            });
            var sel = document.getElementById("menu_sar_input_data");
            if (sel) sel.innerHTML = '<option value="" disabled selected>Select input data</option>';
            sarSetText("status", "");
            sarSetText("total_pulses", "N/A");
            sarSetText("cphd_file_size", "N/A");
            sarSetText("img_size", "N/A");
            sarSetText("resolution", "N/A");
            sarSetText("area_size", "N/A");
            sarSetText("centre_freq", "N/A");
            // Reset images
            var p1 = document.getElementById("processedImage1");
            if (p1) { p1.src = ""; p1.style.display = "none"; }
            var nd1 = document.getElementById("noData1");
            if (nd1) nd1.style.display = "flex";
            clearColorizedImage();
            // Reset output properties
            sarSetText("outFileSize", "N/A");
            sarSetText("reductionFactor", "N/A");
            sarSetText("sizeCompared", "N/A");
            sarSetText("sarProcTime", "N/A");
        }
        
        // ================================================================================================================
        // ========================================= Lower Ethernet Port on board =========================================
        // ================================================================================================================
        async function btnLwEthOnbRunClick() {
            const selectedTestDuration = testDurationLwEthOnb; // Use the global testDuration variable
            const statusNetElement = document.getElementById("statusNet_LwEthOnb");
            const bwDropdown = document.getElementById("bwDropdown_LwEthOnb");

            document.getElementById("upBW_LwEthOnb").textContent = "N/A";
            document.getElementById("upLat_LwEthOnb").textContent = "N/A";
            document.getElementById("upLostTotal_LwEthOnb").textContent = "N/A";
            document.getElementById("downBW_LwEthOnb").textContent = "N/A";
            document.getElementById("downLat_LwEthOnb").textContent = "N/A";
            document.getElementById("downLostTotal_LwEthOnb").textContent = "N/A";

            if (!selectedTestDuration) {
                statusNetElement.textContent = "Please select a duration";
                if (!bwDropdown || !bwDropdown.value || bwDropdown.value === "default") {
                    document.getElementById("statusNet_LwEthOnbBw").textContent = "Please select a bandwidth";
                    return;
                }
                return;
            }
            if (!bwDropdown || !bwDropdown.value || bwDropdown.value === "default") {
                document.getElementById("statusNet_LwEthOnbBw").textContent = "Please select a bandwidth";
                if (!selectedTestDuration) {
                    statusNetElement.textContent = "Please select a duration";
                    return;
                }
                return;
            }
            // Send the NETRUN message via POST request
            await fetch(`${FLASK_BASE}/send_message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: `NETRUN:${selectedTestDuration}:LwEthOnb` })
            });
            statusNetElement.textContent = "Waiting for results...";
            
            await new Promise(resolve => setTimeout(resolve, testDurationLwEthOnb*1000*2+5000));

            fetch(`${FLASK_BASE}/iperf3/lw_eth_onb_results`)
                .then(response => response.json())
                .then(data => {
                    // Extract the relevant data from the JSON response
                    stream = data.down.sum;

                    // Convert bits_per_second to Mbits/sec (divide by 1e6)
                    bitsPerSecondMbit = stream.bits_per_second / 1e6;
                    jitterMs = stream.jitter_ms;
                    lostPackets = stream.lost_packets * 11584 / 1000000000;
                    totalPackets = stream.packets * 11584 / 1000000000;
                    lostPercent = stream.lost_percent;

                    document.getElementById('downBW_LwEthOnb').textContent = `${bitsPerSecondMbit.toFixed(2)} Mbits/sec`;
                    document.getElementById('downLat_LwEthOnb').textContent = `${jitterMs.toFixed(4)} ms`;
                    document.getElementById('downLostTotal_LwEthOnb').textContent = `${lostPackets.toFixed(4)}/${totalPackets.toFixed(4)} Gbits (${lostPercent.toFixed(2)}%)`;

                    // totalPackets = stream.packets;
                    // lostPercent = stream.lost_percent;

                    // Function to format the lostPercent to 2 non-zero decimal points
                    function formatLostPercent(percent) {
                        // Round the number to 2 non-zero digits after the decimal
                        return parseFloat(percent.toFixed(4)); // This keeps 2 decimal digits, removing unnecessary zeros
                    }

                    document.getElementById('downBW_UpEthAdt').textContent = `${bitsPerSecondMbit.toFixed(2)} Mbits/sec`;
                    // document.getElementById('downLat_UpEthAdt').textContent = `${jitterMs.toFixed(4)} ms`;
                    // document.getElementById('downLostTotal_UpEthAdt').textContent = `${lostPackets}/${totalPackets} (${formatLostPercent(lostPercent)}%)`;
                    
                    stream = data.up.sum_sent;

                    // Convert bits_per_second to Mbits/sec (divide by 1e6)
                    bitsPerSecondMbit = stream.bits_per_second / 1e6;
                    // jitterMs = stream.jitter_ms;
                    // lostPackets = stream.lost_packets;
                    // totalPackets = stream.packets;
                    // lostPercent = stream.lost_percent;

                    // Function to format the lostPercent to 2 non-zero decimal points
                    function formatLostPercent(percent) {
                        // Round the number to 2 non-zero digits after the decimal
                        return parseFloat(percent.toFixed(4)); // This keeps 2 decimal digits, removing unnecessary zeros
                    }

                    // Display the extracted information on the page
                    document.getElementById('upBW_UpEthAdt').textContent = `${bitsPerSecondMbit.toFixed(2)} Mbits/sec`;
                    // document.getElementById('upLat_UpEthAdt').textContent = `${jitterMs.toFixed(4)} ms`;
                    // document.getElementById('upLostTotal_UpEthAdt').textContent = `${lostPackets}/${totalPackets} (${formatLostPercent(lostPercent)}%)`;

                    statusNetElement.textContent = "Waiting for results... Done";
                })
                .catch(error => {
                    statusNetElement.textContent = "Test run error";
                    console.error('Error fetching the data:', error);
                });        
        }

        function btnUpEthAdtResetClick() {
            testDurationUpEthAdt = null;
            
            // Reset dropdowns to default option (index 0)
            const durationDropdown = document.getElementById("durationDropdown_UpEthAdt");
            const bwDropdown = document.getElementById("bwDropdown_UpEthAdt");
            
            durationDropdown.selectedIndex = 0;
            bwDropdown.selectedIndex = 0;
            
            // Clear any status messages
            document.getElementById("statusNet_UpEthAdt").textContent = "";
            document.getElementById("statusNet_UpEthAdtBw").textContent = "";
            
            // Reset result displays
            document.getElementById("upBW_UpEthAdt").textContent = "N/A";
            document.getElementById("upLat_UpEthAdt").textContent = "N/A";
            document.getElementById("upLostTotal_UpEthAdt").textContent = "N/A";
            document.getElementById("downBW_UpEthAdt").textContent = "N/A";
            document.getElementById("downLat_UpEthAdt").textContent = "N/A";
            document.getElementById("downLostTotal_UpEthAdt").textContent = "N/A";
        }

        // Function to handle the change in the dropdown value
        function setTestDurationUpEthAdt() {
            document.getElementById("statusNet_UpEthAdt").textContent = "";
            document.getElementById("upBW_UpEthAdt").textContent = "N/A";
            document.getElementById("upLat_UpEthAdt").textContent = "N/A";
            document.getElementById("upLostTotal_UpEthAdt").textContent = "N/A";
            document.getElementById("downBW_UpEthAdt").textContent = "N/A";
            document.getElementById("downLat_UpEthAdt").textContent = "N/A";
            document.getElementById("downLostTotal_UpEthAdt").textContent = "N/A";

            const dropdown = document.getElementById("durationDropdown_UpEthAdt");
            testDurationUpEthAdt = parseInt(dropdown.value, 10);
        }

        function populateBwDropdownUpEthAdt() {
            document.getElementById("statusNet_UpEthAdtBw").textContent = "";

            const dropdown = document.getElementById("bwDropdown_UpEthAdt");
            dropdown.innerHTML = ""; // Clear existing options

            // Add the placeholder (disabled and selected by default)
            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Select Bandwidth";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            dropdown.appendChild(defaultOption);

            // Add real options
            const bandwidthOptions = [
                // { value: "100", text: "100 Mbits/sec" },
                { value: "1000", text: "1000 Mbits/sec" },
                // { value: "2500", text: "2500 Mbits/sec" },
                // { value: "5000", text: "5000 Mbits/sec" },
                { value: "10000", text: "10000 Mbits/sec" }
            ];

            bandwidthOptions.forEach(optionData => {
                const option = document.createElement("option");
                option.value = optionData.value;
                option.textContent = optionData.text;
                dropdown.appendChild(option);
            });
        }

        function setBwUpEthAdt() {
            const dropdown = document.getElementById("bwDropdown_UpEthAdt");
            const selectedBwValue = dropdown.value;
            
            if (selectedBwValue == "") {
                document.getElementById("statusNet_UpEthAdtBw").textContent = ""
                return
            }
            document.getElementById("statusNet_UpEthAdt").textContent = "";
            document.getElementById("upBW_UpEthAdt").textContent = "N/A";
            document.getElementById("upLat_UpEthAdt").textContent = "N/A";
            document.getElementById("upLostTotal_UpEthAdt").textContent = "N/A";
            document.getElementById("downBW_UpEthAdt").textContent = "N/A";
            document.getElementById("downLat_UpEthAdt").textContent = "N/A";
            document.getElementById("downLostTotal_UpEthAdt").textContent = "N/A";
            // Display the status (optional)
            document.getElementById("statusNet_UpEthAdtBw").innerText = "Configuring...";

            fetch(`${FLASK_BASE}/send_message`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: `BW:${selectedBwValue}:UpEthAdt` })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Configuring... Failed");
                }
                // Wait for 5 seconds before updating status
                return new Promise(resolve => {
                    setTimeout(() => resolve("Configuring... Done"), 5000);
                });
            })
            .then(status => {
                document.getElementById("statusNet_UpEthAdtBw").innerText = status;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("statusNet_UpEthAdtBw").innerText = "Error sending";
            });
        }

        restoreState();

        // Grafana re-inserts panel HTML on row expand without re-executing scripts.
        // This observer survives in global scope and triggers restore when the panel re-appears.
        if (!window._sarPanelObserver) {
            window._sarPanelObserver = new MutationObserver((mutations) => {
                for (const mutation of mutations) {
                    for (const node of mutation.addedNodes) {
                        if (node.nodeType !== 1) continue;
                        // Any SAR panel re-appearing (image, input picker, or output)
                        // should trigger a restore. restoreState is idempotent and
                        // null-guarded, so restoring whatever is currently present is safe.
                        var isPanel = node.id === 'processedImage1' || node.id === 'menu_sar_input_data' ||
                            node.id === 'sarProcTime' ||
                            (node.querySelector && (node.querySelector('#processedImage1') ||
                                node.querySelector('#menu_sar_input_data') ||
                                node.querySelector('#sarProcTime')));
                        if (isPanel) {
                            if (localStorage.getItem(SAR_STATE_KEY)) restoreState();
                            return;
                        }
                    }
                }
            });
            window._sarPanelObserver.observe(document.body, { childList: true, subtree: true });
        }

        window.addEventListener("storage", (e) => {
            if (e.key === "panelSync" && e.newValue) {
                const data = JSON.parse(e.newValue);
                if (data.type === "duration") {
                    const dropdown = document.getElementById("durationDropdown_LwEthAdt");
                    dropdown.value = data.value;
                    testDurationLwEthAdt = parseInt(data.value, 10);
                }
                if (data.type === "bandwidth") {
                    const dropdown = document.getElementById("bwDropdown_LwEthAdt");
                    dropdown.value = data.value;
                    setBwLwEthAdt(true);
                }
                if (data.type === "run") {
                    btnLwEthAdtRunClick(true);
                }
                if (data.type === "reset") {
                    btnLwEthAdtResetClick(true);
                }
            }
            if (e.key === "panelResults" && e.newValue) {
                const payload = JSON.parse(e.newValue);
                if (payload.interface === "LwEth10GbE") {
                    updateResultsLwEthAdt(payload.data);
                }
            }
        });
    </script>
</body>
</html>
