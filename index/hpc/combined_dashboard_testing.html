<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight One</title>
    <style>
        /* ------------------------------------------------------------------
           Combined HPC frontend, served by combined_hpc.py at '/'. It is only
           a thin shell: two collapsible sections, each hosting one of the
           existing standalone pages in a same-origin <iframe>:
             * SAR application        -> /sar_app        (sar_process_upload.html)
             * Live system utilisation-> /system_monitor (system_monitor.html)
           Keeping them as iframes means each page stays standalone and is edited
           independently; nothing here touches their CSS/JS. Because both frames
           are same-origin, the monitor frame is auto-sized to its content so the
           whole dashboard scrolls as one page (no nested scrollbar). The SAR page
           is a fixed-height (fill-the-box) design, so its frame keeps a set height.
           The Grafana dark theme is reproduced here so the shell matches the
           frames it hosts.
           ------------------------------------------------------------------ */
        :root {
            --bg:        #020406;
            --border:    #28292f;
            --text:      rgba(204, 204, 220, 0.90);
            --text-weak: rgba(204, 204, 220, 0.65);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            padding: 8px 10px 24px;
        }

        /* ---- collapsible section (Grafana row-header style) ---- */
        .section-row { margin-bottom: 6px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding: 6px 4px;
            color: var(--text-weak);
            font-size: 15px;
            font-weight: 400;
        }
        .section-header:hover { color: var(--text); }
        .section-header .chev {
            display: inline-block;
            font-size: 11px;
            transition: transform 0.15s ease;
        }
        .section-row.collapsed .chev { transform: rotate(-90deg); }
        .section-row.collapsed .section-body { display: none; }

        .frame {
            width: 100%;
            border: none;
            display: block;
            background: var(--bg);
        }

        /* ---- AICRAFT branding header ----------------------------------------
           ------------------------------------------------------------------ */
        .brand-header {
            display: flex;
            align-items: stretch;
            /* gap: 12px; */
            height: 80px;
            /* padding: 6px 4px 10px; */
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .brand-header .bframe { width: 100%; border: none; display: block; background: transparent; }
        .brand-insight { flex: 0 0 217px; min-height: 0; }
        .brand-divider { flex: 0 0 1px; background: var(--border); align-self: center; height: 40px; }
        .brand-aicraft { flex: 0 0 150px; min-height: 0; }
    </style>
</head>
<body>

    <!-- ===================== AICRAFT branding header ===================== -->
    <div class="brand-header">
        <iframe class="bframe brand-insight"  src="/branding/insight_one_logo_panel.html"
                title="Insight One" scrolling="no"></iframe>
        <div class="brand-divider"></div>
        <iframe class="bframe brand-aicraft" src="/branding/ai_craft_logo_panel.html"
                title="Powered by AICRAFT" scrolling="no"></iframe>
    </div>

    <!-- ===================== SAR application ===================== -->
    <div class="section-row" id="sec-sar">
        <div class="section-header" onclick="toggleSection('sec-sar')">
            <span class="chev">&#9662;</span><span>Synthetic aperture radar</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-sar" src="/sar_app"
                    title="Synthetic aperture radar" style="height: 720px;"></iframe>
        </div>
    </div>

    <!-- ===================== VLM application ===================== -->
    <div class="section-row" id="sec-vlm">
        <div class="section-header" onclick="toggleSection('sec-vlm')">
            <span class="chev">&#9662;</span><span>Vision language model</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-vlm" src="/vlm/"
                    title="Vision language model" style="height: 800px;"></iframe>
        </div>
    </div>

    <!-- ===================== CCTV application ===================== -->
    <!-- <div class="section-row" id="sec-cctv">
        <div class="section-header" onclick="toggleSection('sec-cctv')">
            <span class="chev">&#9662;</span><span>CCTV analysis</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-cctv" src="/cctv_app"
                    title="CCTV analysis" style="height: 720px;"></iframe>
        </div>
    </div> -->

    <!-- ===================== Live system utilisation ===================== -->
    <div class="section-row" id="sec-mon">
        <div class="section-header" onclick="toggleSection('sec-mon')">
            <span class="chev">&#9662;</span><span>Live system utilisation</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-mon" src="/system_monitor"
                    title="Live system utilisation" style="height: 600px;"></iframe>
        </div>
    </div>

    <!-- ===================== Topaz box ===================== -->
    <div class="section-row" id="sec-topaz">
        <div class="section-header" onclick="toggleSection('sec-topaz')">
            <span class="chev">&#9662;</span><span>Edge device</span>
        </div>
        <div class="section-body">
            <iframe class="frame" id="frame-topaz" src="/topaz/"
                    title="Edge device" style="height: 1900px;"></iframe>
        </div>
    </div>

    <script>
    (function () {
        "use strict";

        // Same-origin, auto-sized frames. The monitor builds its per-core grid a
        // second or so after load (first /system_metrics response); the Topaz
        // frame is itself a shell whose two inner frames grow after their own
        // data loads — so both need grow-on-poll plus a full remeasure on
        // load/resize. Each entry: [element, fallback height, section id].
        var FRAMES = [
            [document.getElementById("frame-mon"),   600,  "sec-mon"],
            [document.getElementById("frame-topaz"), 1900, "sec-topaz"]
        ];

        function docOf(fr) {
            try { return fr.contentWindow.document; } catch (e) { return null; }
        }
        function contentHeight(d) {
            if (!d) return 0;
            return Math.max(
                d.body ? d.body.scrollHeight : 0,
                d.documentElement ? d.documentElement.scrollHeight : 0
            );
        }
        // Grow-only: lets a frame expand into its content without flicker.
        function grow(fr) {
            var h = contentHeight(docOf(fr));
            if (h && h > fr.offsetHeight) fr.style.height = h + "px";
        }
        // Full remeasure (allows shrinking too) — used on load and on resize,
        // where a responsive grid can get shorter.
        function remeasure(fr, fallback) {
            var d = docOf(fr);
            if (!d) return;
            fr.style.height = "0px";
            fr.style.height = (contentHeight(d) || fallback) + "px";
        }

        FRAMES.forEach(function (f) {
            f[0].addEventListener("load", function () {
                remeasure(f[0], f[1]);
                setTimeout(function () { remeasure(f[0], f[1]); }, 500);   // catch async grids
                setTimeout(function () { remeasure(f[0], f[1]); }, 1500);
            });
        });
        setInterval(function () { FRAMES.forEach(function (f) { grow(f[0]); }); }, 1000);

        var resizeTimer = null;
        window.addEventListener("resize", function () {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                FRAMES.forEach(function (f) { remeasure(f[0], f[1]); });
            }, 200);
        });

        window.toggleSection = function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle("collapsed");
            // Re-fit a frame when its section is revealed (it can't be measured
            // while display:none), on the next frame so layout has settled.
            if (!el.classList.contains("collapsed")) {
                FRAMES.forEach(function (f) {
                    if (f[2] === id) setTimeout(function () { remeasure(f[0], f[1]); }, 50);
                });
            }
        };
    })();
    </script>
</body>
</html>
