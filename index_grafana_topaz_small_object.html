<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Selector</title>
    <style>
        
    </style>
</head>
<body>
    
    <div class="button-container">
        <button onclick="run_small_obj_detect()">Run</button>
        <button onclick="clear_small_obj_detect()">Clear</button>
    </div>

    <script>
        FLASK_HOST = "192.168.0.32";
        FLASK_PORT = 5001;

        function run_small_obj_detect() {
            try {
                fetch(`http://${FLASK_HOST}:${FLASK_PORT}/send_message`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: "run_small_obj_detect" })
                })
                .then(response => response.json())
                .then(data => console.log("Success:", data))
                .catch(error => console.error("Error:", error));
            }
            catch (error) {
                console.error("Error:", error);
            }
        }

        function clear_small_obj_detect() {
        }
    </script>
</body>
</html>
